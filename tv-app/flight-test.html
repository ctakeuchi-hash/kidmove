<style>
  html,body{margin:0;height:100%;background:#0b0b1a;overflow:hidden}
  canvas{display:block}
  #hint{position:fixed;top:8px;left:12px;margin:0;color:#9ad;font:14px system-ui;opacity:.85}
  #score{position:fixed;top:34px;left:12px;margin:0;color:#ffd23f;font:800 24px system-ui;text-shadow:0 1px 5px #000}
</style>
<pre id="hint">Stage E: tilt your arms to bank &amp; pitch, flap to gain height (phone required - arrows/WASD/Space still work with no phone connected) - ` toggles the debug overlay - Esc for menu. Dodge boulders and clear bridges/hills clean for points!</pre>
<pre id="score">Score: 0</pre>
<div id="banner" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;
  flex-direction:column;color:#fff;font:800 56px system-ui;text-shadow:0 2px 12px #000;pointer-events:none;white-space:pre-line;text-align:center"></div>
<pre id="debug" style="display:none;position:fixed;top:8px;right:12px;margin:0;color:#9f9;font:13px monospace;
  background:#000a;padding:10px 14px;border-radius:8px;text-align:right;line-height:1.5"></pre>

<!-- No bundler in this repo (see tv-app/index.html) - Three.js is loaded straight from a CDN via a native
     browser import map, same "no build step" philosophy as the rest of tv-app. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three'

// ponytail: a hand-built low-poly alicorn (primitive box/cone/cylinder geometry, same "simple flat colors"
// style as the canyon gates below) instead of a loaded model - no rigged, clearly-licensed, freely-hotlinkable
// unicorn/pegasus asset exists, and building it directly means the wings can be driven straight from the
// player's real arm angle (see updateWings()) instead of scrubbing a baked animation clip. See buildAlicorn().
const CHASE_OFFSET = new THREE.Vector3(0, 3, 9) // camera position relative to the creature

// ---- Levels: 4 courses of increasing difficulty, each its own landscape theme, auto-advancing on finish (see
// the finish handler in stepPhysics) so a young kid never has to navigate a menu mid-session. Each maze entry
// is a gate {z, gapX, gapWidth, gapY, gapHeight}: gapX/gapY is the center of the opening, gapWidth/gapHeight is
// how big it is; gapY/gapHeight default to CRUISE_Y/CORRIDOR_HEIGHT (dead center, full height = no vertical
// constraint) when omitted. Progression: L1 no climb/dive, wide gaps, 2 obstacles (learn banking) -> L2 adds
// one climb + one dive gate, narrower, 4 obstacles (learn pitch/flap for altitude) -> L3 tighter gaps,
// alternating climb/dive, 5 obstacles -> L4 tightest, most gate variety, 6 obstacles. Still never a fail state
// at any level - bounces are always gentle - so difficulty only affects how good a score you can get, not
// whether a young kid can finish. ----
const LEVELS = [
  { name: 'Green Valley', finishZ: -260,
    maze: [
      { z: -45, gapX: 0, gapWidth: 14 }, { z: -90, gapX: 5, gapWidth: 13 }, { z: -135, gapX: -5, gapWidth: 13 },
      { z: -180, gapX: 4, gapWidth: 13 }, { z: -225, gapX: 0, gapWidth: 14 },
    ],
    obstacles: [{ z: -25, x: 5, y: 9, radius: 1.5 }, { z: -110, x: -5, y: 9, radius: 1.5 }],
    theme: {
      sky: ['#3a7bd5', '#6fa8dc', '#bcd9ea', '#eaf6ff'], fog: 0xbcd9ea,
      ambient: [0xcfe8ff, 0.75], sun: [0xfff3c4, 1.4], rim: [0xffffff, 0.12],
      grass: ['#4a7a2a', '#3f6b22', '#5a8f38'], rock: ['#9c8468', 40, 30, 20], water: ['#2f9fd8', 0x0d5a8a],
    } },
  { name: 'Red Canyon', finishZ: -350,
    maze: [
      { z: -45, gapX: 0, gapWidth: 12 }, { z: -90, gapX: 6, gapWidth: 11 }, { z: -135, gapX: -6, gapWidth: 11 },
      { z: -180, gapX: 0, gapWidth: 10, gapY: 18, gapHeight: 15 }, { z: -225, gapX: 0, gapWidth: 10, gapY: 0, gapHeight: 15 },
      { z: -270, gapX: 6, gapWidth: 11 }, { z: -315, gapX: 0, gapWidth: 12 },
    ],
    obstacles: [
      { z: -22, x: 5, y: 9, radius: 1.6 }, { z: -67, x: -5, y: 10, radius: 1.6 },
      { z: -292, x: -4, y: 11, radius: 1.6 }, { z: -335, x: 4, y: 7, radius: 1.5 },
    ],
    theme: {
      sky: ['#3a1f3a', '#6b2f3a', '#c8543a', '#ffb04a'], fog: 0xc8543a,
      ambient: [0xcc8866, 0.5], sun: [0xffaa55, 1.4], rim: [0x552244, 0.3],
      grass: ['#8a6a3a', '#7a5a2e', '#9c7a48'], rock: ['#8a4a3a', 50, 25, 10], water: ['#2a8fa8', 0x0a4a5a],
    } },
  { name: 'Snowy Peaks', finishZ: -400,
    maze: [
      { z: -45, gapX: 0, gapWidth: 11 }, { z: -90, gapX: -6, gapWidth: 10 },
      { z: -135, gapX: 0, gapWidth: 9, gapY: 18, gapHeight: 14 }, { z: -180, gapX: 6, gapWidth: 10 },
      { z: -225, gapX: 0, gapWidth: 9, gapY: 0, gapHeight: 14 }, { z: -270, gapX: -6, gapWidth: 10 },
      { z: -315, gapX: 0, gapWidth: 9, gapY: 18, gapHeight: 14 }, { z: -360, gapX: 0, gapWidth: 11 },
    ],
    obstacles: [
      { z: -22, x: 5, y: 9, radius: 1.5 }, { z: -67, x: -5, y: 11, radius: 1.5 }, { z: -112, x: 4, y: 6, radius: 1.5 },
      { z: -292, x: -4, y: 12, radius: 1.5 }, { z: -337, x: 5, y: 7, radius: 1.5 },
    ],
    theme: {
      sky: ['#0a1a3a', '#1a3a5a', '#4a6a8a', '#cfe8ff'], fog: 0x4a6a8a,
      ambient: [0x9fc4e8, 0.6], sun: [0xdfefff, 1.2], rim: [0x6688aa, 0.3],
      grass: ['#dbe8f2', '#c8d8e6', '#eef6fc'], rock: ['#7a8590', 30, 30, 35], water: ['#1f6fa0', 0x0a3a5a],
    } },
  { name: 'Dusk Peaks', finishZ: -400,
    maze: [
      { z: -45, gapX: 0, gapWidth: 12 }, { z: -90, gapX: 6, gapWidth: 9 }, { z: -135, gapX: -6, gapWidth: 9 },
      { z: -180, gapX: 0, gapWidth: 9, gapY: 18, gapHeight: 14 }, { z: -225, gapX: 0, gapWidth: 9, gapY: 0, gapHeight: 14 },
      { z: -270, gapX: 6, gapWidth: 9 }, { z: -315, gapX: -6, gapWidth: 9 }, { z: -360, gapX: 0, gapWidth: 12 },
    ],
    obstacles: [
      { z: -22, x: 5, y: 9, radius: 1.6 }, { z: -67, x: -5, y: 11, radius: 1.6 }, { z: -112, x: 4, y: 6, radius: 1.5 },
      { z: -292, x: -4, y: 12, radius: 1.6 }, { z: -337, x: 5, y: 7, radius: 1.5 }, { z: -380, x: -3, y: 10, radius: 1.7 },
    ],
    theme: {
      sky: ['#0b0b2a', '#2a2a55', '#7a5a7a', '#e2895a'], fog: 0x5a4a6a,
      ambient: [0x8fa0cc, 0.55], sun: [0xffb173, 1.3], rim: [0x445577, 0.35],
      grass: ['#3a4a26', '#33421f', '#46592e'], rock: ['#6e6459', 40, 30, 20], water: ['#1c6fb0', 0x0c3a63],
    } },
]
const params = new URLSearchParams(location.search)
const levelIdx = Math.max(0, Math.min(LEVELS.length - 1, (parseInt(params.get('level')) || 1) - 1))
const level = LEVELS[levelIdx]
const theme = level.theme

const CORRIDOR_BOTTOM = -10, CORRIDOR_TOP = 30, CORRIDOR_HEIGHT = CORRIDOR_TOP - CORRIDOR_BOTTOM
const CORRIDOR_HALF_WIDTH = 14
const CRUISE_Y = 8          // default/starting altitude - the vertical center most gates are built around
const GATE_THICKNESS = 6    // how deep (along z) each gate's frame geometry/collision zone is
const MAZE = level.maze.map((g) => ({ ...g, hit: false, scored: false })) // g.constrained is set below once its rock mass is built
const FINISH_Z = level.finishZ // past the last gate; crossing this triggers the celebration
const CELEBRATE_MS = 3000    // how long the celebration plays before advancing to the next level

// ---- Obstacles: freestanding boulders to steer around, separate from the MAZE gates - placed off-center
// with generous clearance to either side (same "easy for young kids" philosophy as MAZE), skipped near the
// already-trickier climb/dive gates so difficulty doesn't stack. hit/scored are runtime state (fresh each
// page load, since a new level is a full navigation, not a reset): hit becomes true on any collision with
// that boulder; scored fires once, the first time the creature's z passes it, and only awards points if it
// was never hit. ----
const OBSTACLES = level.obstacles.map((o) => ({ ...o, hit: false, scored: false }))
const SCORE_OBSTACLE = 10, SCORE_GATE = 15 // points for a clean dodge / a clean pass through a bridge or hill gate

// ---- Stage B tuning: all easily retunable from here, matching tv-app/index.html's CONFIG convention.
// Bank/pitch self-level back to 0 when released - forgiving for young kids, same easy-difficulty philosophy
// as the rest of the app. Flap is a glide-then-sink model: holding it gains altitude+speed, releasing bleeds
// both off gradually (never a hard stop). ----
const MAX_BANK = 0.6, BANK_RATE = 2.2, BANK_LEVEL_RATE = 1.6, TURN_SPEED = 8   // rad, rad/s, rad/s, units/s per rad
// Visual roll only (steering itself always uses the untouched `bank` value below) - "bank into the turn"
// means the side you're turning toward should dip down. Verified this sign with a headless three.js script
// (not committed): rotation.z = +1*bank raises the turned-toward side, which is backward; -1 is correct.
const BANK_ROLL_SIGN = -1
const MAX_PITCH = 0.5, PITCH_RATE = 2.2, PITCH_LEVEL_RATE = 1.6, PITCH_CLIMB_RATE = 6
const FLAP_LIFT = 14, GRAVITY = 9, FLAP_ACCEL = 4, DRAG = 2, MIN_SPEED = 3, MAX_SPEED = 12, MAX_VY = 8
const CREATURE_RADIUS = 1.5, Y_MIN = CORRIDOR_BOTTOM + 2, Y_MAX = CORRIDOR_TOP - 4
const WALL_BOUNCE_DAMPING = 0.85 // speed multiplier on hitting a wall - a brief slow-down, never a hard stop

// ---- Input: arrow keys or WASD for bank/pitch, Space to flap. preventDefault so the page doesn't scroll. ----
const keys = {}
const KEY_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'a', 'A', 'd', 'D', 'w', 'W', 's', 'S', ' ']
addEventListener('keydown', (e) => { if (KEY_KEYS.includes(e.key)) { keys[e.key] = true; e.preventDefault() } })
addEventListener('keyup', (e) => { keys[e.key] = false })
const held = (...ks) => ks.some((k) => keys[k])

// Stage E: a toggleable debug overlay (hidden by default - only shown while actively tuning) so sensitivity
// constants below can be adjusted by watching real numbers instead of guessing. ` matches the common
// game-debug-console convention and isn't used by any other control here.
const debugEl = document.getElementById('debug')
let debugVisible = false
addEventListener('keydown', (e) => { if (e.key === '`') { debugVisible = !debugVisible; debugEl.style.display = debugVisible ? 'block' : 'none' } })
addEventListener('keydown', (e) => { if (e.key === 'Escape') location.href = 'index.html' })

// ---- Stage D: pose-driven flight controls. When a phone is streaming live pose data (fresher than
// POSE_TIMEOUT_MS), it overrides the keyboard entirely for bank/pitch/flap; with no phone connected, the
// Stage B keyboard controls keep working - handy for testing without a phone, and for A/B comparing feel.
// Reuses the pose stream already flowing phone -> server -> TV for the main app's avatar (phone-app's `b`
// body-keypoint array already includes shoulders + wrists), so no phone-app or server changes are needed. ----
const POSE_TIMEOUT_MS = 500
// Tune these against REAL pose data once you can playtest with a phone - turn on the debug overlay (` key)
// to watch the live numbers below while you adjust. Normalized-coordinate ranges vary with how far the phone
// is from the player, so these starting values are a best guess, not measured.
const BANK_SIGN = 1        // flip to -1 if banking feels backward once tested for real
const BANK_GAIN = 1.0      // how much wrist tilt (in shoulder-widths) maps to full bank
const PITCH_GAIN = 1.0     // how much arm-height tilt (in shoulder-widths) maps to full pitch (nose attitude only - see stepPhysics)
// Flapping is a continuous rate, not an on/off gesture: altitude comes from how fast the player is actually
// moving their arms (in either direction - a real flap has an up stroke and a down stroke), so holding arms
// still - even held high - gives no lift and the creature sinks, same as not flapping at all.
const FLAP_RATE_DEADZONE = 0.4    // normalized-y-units/sec of wrist motion below this doesn't count as flapping (filters hold-still jitter)
const FLAP_RATE_SATURATION = 3.0  // wrist motion at/above this rate gives full lift; flapping harder doesn't add more

let lastPoseAt = -1e9, poseBank = 0, posePitch = 0, poseFlapRate = 0
let lastBody = null // raw keypoints from the most recent pose, kept only for the debug overlay
const wristYHistory = [] // rolling {t, y} window used to measure how fast the wrists are currently moving
const clamp1 = (v) => Math.max(-1, Math.min(1, v))

// b = the phone's full body keypoint array, in phone-app's BODY order: [nose, Lsh, Rsh, Lel, Rel, Lwr, Rwr, Lhip, Rhip, ...]
function onPose(b) {
  const [, lsh, rsh, , , lwr, rwr] = b
  lastBody = b
  const shoulderW = Math.abs(rsh[0] - lsh[0]) || 0.001 // normalizes tilt by how big the person appears - distance-invariant
  const shoulderY = (lsh[1] + rsh[1]) / 2, avgWristY = (lwr[1] + rwr[1]) / 2

  // Bank: wrists tilted like airplane wings - left wrist higher (smaller y) than right = bank right.
  poseBank = BANK_SIGN * clamp1(((rwr[1] - lwr[1]) / shoulderW) * BANK_GAIN)
  // Pitch: average wrist height relative to shoulders - arms raised (smaller y) = nose up.
  posePitch = clamp1(((shoulderY - avgWristY) / shoulderW) * PITCH_GAIN)

  const now = performance.now()
  wristYHistory.push({ t: now, y: avgWristY })
  while (wristYHistory.length && now - wristYHistory[0].t > 300) wristYHistory.shift()
  const oldest = wristYHistory[0]
  if (oldest && now - oldest.t > 80) poseFlapRate = Math.abs(oldest.y - avgWristY) / ((now - oldest.t) / 1000) // abs: both strokes of a flap count
  lastPoseAt = now
}
const poseLive = () => performance.now() - lastPoseAt < POSE_TIMEOUT_MS

const ws = new WebSocket(`wss://${location.host}/?role=tv`)
ws.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'kp') { const b = (m.ps?.[0] || m).b; if (b) onPose(b) }
}

// ---- Procedural canvas textures: no image assets in this repo (everything is hand-built), so grass/rock/
// water detail and the sky gradient are drawn to small offscreen canvases at load time instead of loading
// files - zero new dependencies, matches the "no bundler" philosophy the rest of tv-app already follows. ----
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h
  draw(c.getContext('2d'), w, h)
  return new THREE.CanvasTexture(c)
}
function tiledTexture(size, repeatX, repeatY, draw) {
  const tex = canvasTexture(size, size, draw)
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping
  tex.repeat.set(repeatX, repeatY)
  return tex
}
const skyTex = canvasTexture(2, 256, (ctx, w, h) => { // tall vertical strip, canvas Y 0=top=zenith
  const g = ctx.createLinearGradient(0, 0, 0, h)
  g.addColorStop(0, theme.sky[0]); g.addColorStop(0.55, theme.sky[1]); g.addColorStop(0.8, theme.sky[2]); g.addColorStop(1, theme.sky[3])
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h)
})

const scene = new THREE.Scene()
scene.background = skyTex
scene.fog = new THREE.Fog(theme.fog, 60, 180) // matches the sky gradient's haze band, so distant terrain fades into the sky instead of a mismatched flat color

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500)
camera.position.copy(CHASE_OFFSET) // third-person chase view: behind and slightly above the creature

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(Math.min(2, devicePixelRatio))
document.body.appendChild(renderer.domElement)
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix()
  renderer.setSize(innerWidth, innerHeight)
})

// Per-theme lighting to match the sky gradient: a colored key "sun" light, a colored ambient fill (the sky's
// own bounce light), and a dim rim light from behind for a bit of edge separation - no shadow maps (real
// per-object shadow casting is expensive and frame rate on the target TV hardware is already an open question).
scene.add(new THREE.AmbientLight(...theme.ambient))
const sun = new THREE.DirectionalLight(...theme.sun)
sun.position.set(15, 25, 10)
scene.add(sun)
const rim = new THREE.DirectionalLight(...theme.rim)
rim.position.set(-10, 10, -15)
scene.add(rim)

// ---- Landscape: a grass floor with a winding river, mountain ranges along both sides, and scattered trees,
// plus one "gate" per MAZE entry - the same collidable risers as before (left/right walls become mountain
// slopes, floor risers become rocky hills, ceiling risers become stone overpasses/bridges you duck under).
// All still simple primitive geometry, just dressed up with procedural textures and gentle terrain - the
// collision math (an invisible AABB, unrelated to what's rendered) is completely untouched throughout. ----

// A small hand-rolled 2D value-noise (hash + smoothstep interpolation) - not true Perlin/Simplex, but plenty
// smooth for gently rolling ground, and it's 4 lines instead of a new dependency.
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s) }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi
  const s = xf * xf * (3 - 2 * xf), t = yf * yf * (3 - 2 * yf)
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1)
  return a + (b - a) * s + (c - a) * t + (a - b - c + d) * s * t
}

const grassTex = tiledTexture(64, 20, 40, (ctx, s) => {
  ctx.fillStyle = theme.grass[0]; ctx.fillRect(0, 0, s, s)
  for (let i = 0; i < 400; i++) { ctx.fillStyle = Math.random() < 0.5 ? theme.grass[1] : theme.grass[2]; ctx.fillRect(Math.random() * s, Math.random() * s, 2, 2) }
})
const floorLen = -FINISH_Z + 40
const floorGeo = new THREE.PlaneGeometry(CORRIDOR_HALF_WIDTH * 2 + 60, floorLen, 32, 64)
const floorPos = floorGeo.attributes.position
for (let i = 0; i < floorPos.count; i++) { // gentle rolling hills - two noise octaves, amplitude kept modest (~2.4 units) since this is purely cosmetic ground detail, well clear of any collision boundary
  const x = floorPos.getX(i), y = floorPos.getY(i)
  floorPos.setZ(i, noise2(x * 0.05, y * 0.05) * 1.8 + noise2(x * 0.15, y * 0.15) * 0.6)
}
floorGeo.computeVertexNormals()
const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({ map: grassTex, roughness: 0.9 }))
floor.rotation.x = -Math.PI / 2
floor.position.set(0, CORRIDOR_BOTTOM, FINISH_Z / 2)
scene.add(floor)

// River: follows the same left/right path as the flyable gaps (interpolated from MAZE gapX), so it always
// runs down the valley between the mountain walls instead of an arbitrary path that could cross under one.
function gapXAt(z) {
  if (z >= MAZE[0].z) return MAZE[0].gapX
  if (z <= MAZE[MAZE.length - 1].z) return MAZE[MAZE.length - 1].gapX
  for (let i = 0; i < MAZE.length - 1; i++) {
    const a = MAZE[i], b = MAZE[i + 1]
    if (z <= a.z && z >= b.z) { const t = (a.z - z) / (a.z - b.z); return a.gapX + (b.gapX - a.gapX) * t }
  }
  return 0
}
const riverX = gapXAt
const waterTex = tiledTexture(64, 1, 90, (ctx, s) => {
  ctx.fillStyle = theme.water[0]; ctx.fillRect(0, 0, s, s)
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'
  for (let i = 0; i < 40; i++) { const y = Math.random() * s; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y + Math.random() * 6 - 3); ctx.stroke() }
})
// emissive keeps the water reading as its own color regardless of the theme's key light - without it, a warm
// key light washes the river out to a flat stone-gray, same as everything else it touches (found on Dusk Peaks).
const riverMat = new THREE.MeshStandardMaterial({ map: waterTex, roughness: 0.25, emissive: theme.water[1], emissiveIntensity: 0.6 })
for (let z = 15; z > FINISH_Z - 15; z -= 13) {
  const seg = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.1, 14), riverMat)
  seg.position.set(riverX(z), CORRIDOR_BOTTOM + 2.8, z) // ground noise amplitude tops out at 1.8+0.6=2.4 (see floorPos loop above) - stay clear of that or the river gets buried under a bump
  scene.add(seg)
}

// Trees: simple cone+cylinder, scattered just outside the flyable corridor on both sides. Segment counts are
// high enough to read as round/smooth rather than faceted low-poly - it's still just a cone and a cylinder,
// no new geometry system needed for that.
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5b3a22, roughness: 0.9 })
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f6b34, roughness: 0.8 })
function addTree(x, z, scale) {
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25 * scale, 0.3 * scale, 1.6 * scale, 12), trunkMat)
  trunk.position.set(x, CORRIDOR_BOTTOM + 0.8 * scale, z)
  scene.add(trunk)
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.1 * scale, 2.4 * scale, 14), leafMat)
  leaves.position.set(x, CORRIDOR_BOTTOM + 2.2 * scale, z)
  scene.add(leaves)
}
for (let z = 10; z > FINISH_Z - 10; z -= 16) { // ponytail: sparse on purpose - each tree is 2 draw calls and this is a lot of trees; densify only after confirming frame rate on the real (old, weak) TV box
  addTree(CORRIDOR_HALF_WIDTH + 1.5 + Math.random() * 3, z + Math.random() * 4, 0.7 + Math.random() * 0.6)
  addTree(-CORRIDOR_HALF_WIDTH - 1.5 - Math.random() * 3, z + Math.random() * 4, 0.7 + Math.random() * 0.6)
}

// Mountains: a continuous jagged skyline of smooth (high-segment, not low-poly-faceted) cone peaks along both
// sides, well above the flyable corridor (CORRIDOR_TOP) so they're pure backdrop, never collidable. Taller
// peaks get a small white snow cap. rockMat is reused below by addRockMass() for the collidable obstacles.
const rockTex = tiledTexture(64, 3, 3, (ctx, s) => {
  const [base, dr, dg, db] = theme.rock
  ctx.fillStyle = base; ctx.fillRect(0, 0, s, s)
  for (let i = 0; i < 500; i++) { const v = 60 + Math.random() * 60; ctx.fillStyle = `rgb(${v + dr},${v + dg},${v + db})`; ctx.fillRect(Math.random() * s, Math.random() * s, 3, 3) }
})
const rockMat = new THREE.MeshStandardMaterial({ map: rockTex, roughness: 0.95 })
const snowMat = new THREE.MeshStandardMaterial({ color: 0xf0f2f5, roughness: 0.8 })
function addPeak(x, z, h, radius = h * 0.55) {
  const peak = new THREE.Mesh(new THREE.ConeGeometry(radius, h, 16), rockMat)
  peak.position.set(x, CORRIDOR_BOTTOM + h / 2, z)
  scene.add(peak)
  if (h > 26) { // snow cap: a smaller cone centered near the peak's apex, mostly embedded so it reads as a cap
    const capH = h * 0.3
    const cap = new THREE.Mesh(new THREE.ConeGeometry(radius * 0.3, capH, 16), snowMat)
    cap.position.set(x, CORRIDOR_BOTTOM + h - capH * 0.3, z)
    scene.add(cap)
  }
}
for (let z = 25; z > FINISH_Z - 25; z -= 26) {
  addPeak(CORRIDOR_HALF_WIDTH + 6 + Math.random() * 10, z + Math.random() * 8, 24 + Math.random() * 20)
  addPeak(-CORRIDOR_HALF_WIDTH - 6 - Math.random() * 10, z + Math.random() * 8, 24 + Math.random() * 20)
}

// Clouds: a few overlapping smooth spheres per cluster, semi-transparent so they stay soft/fluffy rather than
// looking like solid rocks. Not part of MAZE/currentGate(), so collision never checks against them - the
// player flies straight through, by design ("clouds you can't run into").
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.9, transparent: true, opacity: 0.85 })
function addCloud(x, y, z, scale) {
  for (const [dx, dy, dz, r] of [[0, 0, 0, 1], [0.8, 0.15, 0.3, 0.75], [-0.9, 0.1, -0.2, 0.7], [0.2, 0.35, -0.6, 0.6]]) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(r * scale, 12, 8), cloudMat)
    puff.position.set(x + dx * scale, y + dy * scale, z + dz * scale)
    scene.add(puff)
  }
}
for (let z = 20; z > FINISH_Z - 20; z -= 45) {
  addCloud((Math.random() - 0.5) * CORRIDOR_HALF_WIDTH * 1.6, CRUISE_Y + 6 + Math.random() * 10, z + Math.random() * 15, 1.5 + Math.random())
}

// Every collidable obstacle (walls, floor risers) is a rock mass built from a row of mountain cones instead
// of a flat box - the route through the maze is walled in by actual mountains, not architecture.
// addRockMass() fills the same rectangular footprint (xCenter/width, yBase/height) that the invisible AABB
// collision below still uses, so gameplay is unchanged - only what gets rendered there changed. Cone centers
// are INSET by one radius from both edges of the footprint (not spread edge-to-edge), so no cone's outer
// surface ever crosses the footprint boundary into the flyable gap next to it; neighboring cones are still
// spaced closer than 2x their radius so they overlap each other, leaving no visible gaps between them.
function addRockCone(x, radius, yBase, height, z) {
  const h = height * (0.95 + Math.random() * 0.35) // slightly tall/jagged rather than exactly filling the box
  const cone = new THREE.Mesh(new THREE.ConeGeometry(radius, h, 16), rockMat)
  cone.position.set(x, yBase + h / 2, z + (Math.random() - 0.5) * GATE_THICKNESS * 0.3)
  scene.add(cone)
}
function addRockMass(xCenter, width, yBase, height, z) {
  if (width <= 0.05 || height <= 0.05) return
  const radius = 2.4
  if (width <= radius * 2) { addRockCone(xCenter, Math.min(radius, width / 2), yBase, height, z); return }
  const usable = width - radius * 2 // inset by one radius on each side
  const n = Math.max(2, Math.ceil(usable / (radius * 1.3)) + 1) // spacing < 2*radius guarantees overlap
  for (let i = 0; i < n; i++) addRockCone(xCenter - width / 2 + radius + usable * i / (n - 1), radius, yBase, height, z)
}
// Bridge: a flat stone deck on two piers, not a mountain shape - a real bridge, matching what the player is
// meant to read as "fly under this". No cones anywhere in it. The deck's underside sits exactly at yBase (the
// actual collision boundary), the same edge-touching-not-crossing rule addRockMass follows. It's deliberately
// NOT sized to fill the whole band up to CORRIDOR_TOP - the per-gate collision clamp in stepPhysics already
// stops the player right at the deck's underside, so nothing above a modest deck is ever visible or reachable;
// making it that tall only produced an oversized shape looming in the sky for no visual benefit.
function addBridge(xCenter, width, yBase, height, z) {
  if (width <= 0.05 || height <= 0.05) return
  const deckH = Math.min(2.5, height * 0.4)
  const deck = new THREE.Mesh(new THREE.BoxGeometry(width, deckH, GATE_THICKNESS), rockMat)
  deck.position.set(xCenter, yBase + deckH / 2, z)
  scene.add(deck)
  const pierW = 2.2 // piers sit entirely outside the gap (footprint ends exactly at the gap edge, not straddling it)
  const pier = (x) => { const m = new THREE.Mesh(new THREE.BoxGeometry(pierW, yBase - CORRIDOR_BOTTOM, GATE_THICKNESS * 0.6), rockMat); m.position.set(x, (CORRIDOR_BOTTOM + yBase) / 2, z); scene.add(m) }
  pier(xCenter - width / 2 - pierW / 2)
  pier(xCenter + width / 2 + pierW / 2)
}
for (const g of MAZE) {
  const gapY = g.gapY ?? CRUISE_Y, gapHeight = g.gapHeight ?? CORRIDOR_HEIGHT
  const leftEdge = g.gapX - g.gapWidth / 2, rightEdge = g.gapX + g.gapWidth / 2
  const floorH = (gapY - gapHeight / 2) - CORRIDOR_BOTTOM, ceilingH = CORRIDOR_TOP - (gapY + gapHeight / 2)
  addRockMass((-CORRIDOR_HALF_WIDTH + leftEdge) / 2, leftEdge - (-CORRIDOR_HALF_WIDTH), CORRIDOR_BOTTOM, CORRIDOR_HEIGHT, g.z) // left mountain wall
  addRockMass((rightEdge + CORRIDOR_HALF_WIDTH) / 2, CORRIDOR_HALF_WIDTH - rightEdge, CORRIDOR_BOTTOM, CORRIDOR_HEIGHT, g.z) // right mountain wall
  // Floor/ceiling risers only render past a real height (>8) - CRUISE_Y (8) isn't exactly the corridor's
  // vertical center (10), so an unconstrained "straight" gate leaves a tiny few-unit residual on the default
  // side, harmless as a thin flat sliver but very visible as chunky cones spanning the whole gap width. Only
  // climb/dive gates clear this threshold; straight gates correctly render nothing on the small side.
  if (floorH > 8) addRockMass(g.gapX, g.gapWidth, CORRIDOR_BOTTOM, floorH, g.z) // rocky hill you climb over (climb gates)
  if (ceilingH > 8) addBridge(g.gapX, g.gapWidth, gapY + gapHeight / 2, ceilingH, g.z) // stone bridge you duck under (dive gates)
  g.constrained = floorH > 8 || ceilingH > 8 // only a real hill/bridge gate is worth scoring - a wide-open straight gate isn't a challenge
}

// Boulders: low-poly rocks (icosahedra - angular and irregular, not smooth like the mountains, so they read
// as distinct dodge targets) at each OBSTACLES entry, random rotation for visual variety only. Shares rockTex
// with the mountains for the same speckled detail, tinted lighter so they still read as a separate object.
const boulderMat = new THREE.MeshStandardMaterial({ map: rockTex, color: 0xb0aa9c, roughness: 0.95 })
for (const o of OBSTACLES) {
  const rock = new THREE.Mesh(new THREE.IcosahedronGeometry(o.radius, 0), boulderMat)
  rock.position.set(o.x, o.y, o.z)
  rock.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI)
  scene.add(rock)
}

// ---- Creature: a horse body with bird wings, built from primitive geometry (boxes/cones/cylinders), same
// "simple flat colors" style as the canyon gates above. Faces -Z directly (its direction of travel), so no
// load step or extra facing rotation is needed. Sizes are a best guess against CREATURE_RADIUS/CHASE_OFFSET
// below, not visually tuned - adjust once you can see it on a real screen. ----
function buildAlicorn() {
  const g = new THREE.Group()
  const coat = new THREE.MeshStandardMaterial({ color: 0xf3ecff, roughness: 0.8 })
  const hoof = new THREE.MeshStandardMaterial({ color: 0x33303c, roughness: 0.9 })
  const gold = new THREE.MeshStandardMaterial({ color: 0xffd23f, roughness: 0.4, metalness: 0.3 })
  const mane = new THREE.MeshStandardMaterial({ color: 0xb968e3, roughness: 0.7 })
  const feather = new THREE.MeshStandardMaterial({ color: 0xdff0ff, roughness: 0.7 })
  const featherTip = new THREE.MeshStandardMaterial({ color: 0x8fc7ea, roughness: 0.7 })
  const add = (mesh, x, y, z, rx = 0) => { mesh.position.set(x, y, z); mesh.rotation.x = rx; g.add(mesh) }

  add(new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 2.2), coat), 0, 0.9, 0) // body
  add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.85, 0.5), coat), 0, 1.35, -1.25, 0.55) // neck
  add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.55), coat), 0, 1.85, -1.75) // head
  add(new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.35), coat), 0, 1.78, -2.05) // snout
  add(new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 10), coat), -0.14, 2.1, -1.7, -0.3) // ears
  add(new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.22, 10), coat), 0.14, 2.1, -1.7, -0.3)
  add(new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.5, 12), gold), 0, 2.15, -1.95, -0.35) // horn, angled forward
  for (let i = 0; i < 5; i++) add(new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.22, 0.14), mane), 0, 1.55 + i * 0.05, -1.55 + i * 0.28) // mane ridge
  add(new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.0, 12), mane), 0, 0.9, 1.35, Math.PI / 2 + 0.5) // tail
  for (const [x, z] of [[-0.32, -0.7], [0.32, -0.7], [-0.32, 0.7], [0.32, 0.7]]) { // legs, tucked back (flying pose)
    add(new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.06, 0.7, 10), coat), x, 0.45, z, 0.5)
    add(new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.2), hoof), x, 0.15, z + 0.3)
  }

  // Wings: bird-style - a flat "arm" panel plus fanned primary feathers, mounted on a shoulder pivot Group so
  // the whole assembly rotates together for the flap (see updateWings()). side: 1 = right (+X), -1 = left (-X).
  function buildWing(side) {
    const pivot = new THREE.Group()
    pivot.position.set(side * 0.4, 1.05, -0.3)
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.06, 0.5), feather)
    arm.position.set(side * 0.55, 0, 0.05)
    pivot.add(arm)
    for (let i = 0; i < 4; i++) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.15), i === 3 ? featherTip : feather)
      f.position.set(side * (1.05 + i * 0.22), 0, 0.35 + i * 0.14)
      f.rotation.y = side * (0.15 + i * 0.05)
      pivot.add(f)
    }
    g.add(pivot)
    return pivot
  }
  return { group: g, wingR: buildWing(1), wingL: buildWing(-1) }
}
const { group: creature, wingR, wingL } = buildAlicorn()
creature.position.set(0, CRUISE_Y, 0)
scene.add(creature)

// ---- Flight physics state ----
let bank = 0, pitch = 0, vy = 0, speed = MIN_SPEED, wingRate = 0 // wingRate: 0-1 flap intensity that drives lift; the wing visual is driven separately, see updateWings()
let finished = false, finishAt = 0
let score = Math.max(0, parseInt(params.get('score')) || 0) // carried forward from the previous level, see the finish handler below

// The gate whose collision zone the creature is currently inside (z within GATE_THICKNESS/2 of a gate's z),
// or null between gates - most of the corridor is open flying space with nothing to collide with.
function currentGate() {
  const z = creature.position.z
  return MAZE.find((g) => Math.abs(z - g.z) < GATE_THICKNESS / 2) || null
}

function stepPhysics(dt) {
  const pose = poseLive() // fresh phone pose data takes over from the keyboard entirely when present

  // Bank: ramp toward the held/pose direction's max, self-level toward 0 otherwise; steer x by the bank angle.
  const bankTarget = pose ? poseBank * MAX_BANK : held('ArrowLeft', 'a', 'A') ? -MAX_BANK : held('ArrowRight', 'd', 'D') ? MAX_BANK : 0
  const bankRate = bankTarget === 0 ? BANK_LEVEL_RATE : BANK_RATE
  bank += Math.sign(bankTarget - bank) * Math.min(Math.abs(bankTarget - bank), bankRate * dt)
  creature.rotation.z = BANK_ROLL_SIGN * bank // "bank into the turn": the side you're turning toward dips down
  creature.position.x += Math.sin(bank) * TURN_SPEED * dt

  // Pitch: nose attitude only (visual + arrow-key climb when there's no phone) - in pose mode, altitude comes
  // solely from flapping below, so just holding your arms up doesn't climb.
  const pitchTarget = pose ? posePitch * MAX_PITCH : held('ArrowUp', 'w', 'W') ? MAX_PITCH : held('ArrowDown', 's', 'S') ? -MAX_PITCH : 0
  const pitchRate = pitchTarget === 0 ? PITCH_LEVEL_RATE : PITCH_RATE
  pitch += Math.sign(pitchTarget - pitch) * Math.min(Math.abs(pitchTarget - pitch), pitchRate * dt)
  creature.rotation.x = pitch
  if (!pose) creature.position.y += Math.sin(pitch) * PITCH_CLIMB_RATE * dt

  // Flap: lift scales with how fast the wrists are actually moving - no motion (even arms held high) gives no
  // lift and the creature sinks, same as not flapping; flapping harder (up to saturation) climbs faster.
  const flapRate = pose ? poseFlapRate : (held(' ') ? FLAP_RATE_SATURATION : 0)
  wingRate = clamp1((flapRate - FLAP_RATE_DEADZONE) / (FLAP_RATE_SATURATION - FLAP_RATE_DEADZONE))
  if (wingRate > 0) { vy += FLAP_LIFT * wingRate * dt; speed = Math.min(MAX_SPEED, speed + FLAP_ACCEL * wingRate * dt) }
  else { vy -= GRAVITY * dt; speed = Math.max(MIN_SPEED, speed - DRAG * dt) }
  vy = Math.max(-MAX_VY, Math.min(MAX_VY, vy))
  creature.position.y += vy * dt
  if (creature.position.y < Y_MIN) { creature.position.y = Y_MIN; vy = Math.max(0, vy) }
  else if (creature.position.y > Y_MAX) { creature.position.y = Y_MAX; vy = Math.min(0, vy) }

  // Forward motion.
  creature.position.z -= speed * dt

  // Gate collision: gentle bounce-back + brief slow-down, never a hard stop (matches Jump Dodge's low-stakes
  // misses). Damping is floored at MIN_SPEED so leaning into a wall settles into a brief slow-down, never
  // drains toward zero/negative if the player keeps holding the bank/pitch key against it.
  const gate = currentGate()
  if (gate) {
    const halfW = gate.gapWidth / 2 - CREATURE_RADIUS
    if (creature.position.x > gate.gapX + halfW) { creature.position.x = gate.gapX + halfW; bank = -Math.abs(bank) * 0.5; speed = Math.max(MIN_SPEED, speed * WALL_BOUNCE_DAMPING); gate.hit = true }
    else if (creature.position.x < gate.gapX - halfW) { creature.position.x = gate.gapX - halfW; bank = Math.abs(bank) * 0.5; speed = Math.max(MIN_SPEED, speed * WALL_BOUNCE_DAMPING); gate.hit = true }
    const gapY = gate.gapY ?? CRUISE_Y, gapHeight = gate.gapHeight ?? CORRIDOR_HEIGHT
    if (gapHeight < CORRIDOR_HEIGHT - 0.5) { // only gates with a real vertical constraint can collide on y
      const halfH = gapHeight / 2 - CREATURE_RADIUS
      if (creature.position.y > gapY + halfH) { creature.position.y = gapY + halfH; vy = Math.min(0, vy); speed = Math.max(MIN_SPEED, speed * WALL_BOUNCE_DAMPING); gate.hit = true }
      else if (creature.position.y < gapY - halfH) { creature.position.y = gapY - halfH; vy = Math.max(0, vy); speed = Math.max(MIN_SPEED, speed * WALL_BOUNCE_DAMPING); gate.hit = true }
    }
  }

  // Obstacle collision: a true 3D sphere-sphere check (unlike the gates' flat AABB walls, these are freestanding
  // points in open space) - gentle radial push-back + the same brief slow-down as a wall, never a hard stop.
  for (const o of OBSTACLES) {
    const dx = creature.position.x - o.x, dy = creature.position.y - o.y, dz = creature.position.z - o.z
    const minDist = o.radius + CREATURE_RADIUS
    const distSq = dx * dx + dy * dy + dz * dz
    if (distSq < minDist * minDist && distSq > 1e-6) {
      const dist = Math.sqrt(distSq), push = minDist - dist
      creature.position.x += (dx / dist) * push
      creature.position.y += (dy / dist) * push
      speed = Math.max(MIN_SPEED, speed * WALL_BOUNCE_DAMPING)
      o.hit = true
    }
  }

  // Scoring: the first time the creature's z fully clears a constrained gate (a real bridge/hill, not a wide-
  // open straight one) or an obstacle, award points if it was never hit along the way - dodging cleanly or
  // threading a gate cleanly, not just eventually getting past it. A small confetti pop marks the moment.
  for (const g of MAZE) {
    if (!g.scored && g.constrained && creature.position.z < g.z - GATE_THICKNESS / 2) {
      g.scored = true
      if (!g.hit) { score += SCORE_GATE; spawnConfetti(creature.position, 10) }
    }
  }
  for (const o of OBSTACLES) {
    if (!o.scored && creature.position.z < o.z - o.radius - CREATURE_RADIUS) {
      o.scored = true
      if (!o.hit) { score += SCORE_OBSTACLE; spawnConfetti(creature.position, 10) }
    }
  }

  // Finish: crossing the end of the level celebrates, then advances to the next level after a pause (wrapping
  // back to level 1 - and a fresh score - after the last one), a full page navigation since each level is a
  // genuinely different maze/theme, not just a state reset. See tick() for the actual navigation.
  if (!finished && creature.position.z < FINISH_Z) {
    finished = true; finishAt = performance.now()
    const isLast = levelIdx === LEVELS.length - 1
    banner.textContent = `🎉 ${level.name} complete! Score ${score} 🎉` + (isLast ? '\nBack to Green Valley!' : `\nOn to ${LEVELS[levelIdx + 1].name}!`)
    banner.style.display = 'flex'
    spawnConfetti(creature.position)
  }
}

// Wings mirror the player's actual arm position frame by frame (direct rotation, not a playback rate) - so a
// still arm means a still wing, and moving your arm up/down visibly moves the wing up/down in step. Keyboard
// mode has no arm position to mirror, so it falls back to a simple loop while Space is held.
const MAX_WING_ANGLE = 0.9 // radians of shoulder rotation at full arm extension (~50 degrees)
const WING_TIME_SIGN = 1   // flip to -1 if arms-up ever looks wings-down once tested on real hardware
const KEY_FLAP_HZ = 2.2    // keyboard-only fallback flap speed while Space is held
function updateWings(now) {
  const angle = poseLive()
    ? WING_TIME_SIGN * posePitch * MAX_WING_ANGLE // posePitch: -1 arms down .. +1 arms up
    : (held(' ') ? Math.sin(now / 1000 * KEY_FLAP_HZ * 2 * Math.PI) * MAX_WING_ANGLE : 0)
  wingR.rotation.z = angle
  wingL.rotation.z = -angle
}

// ---- Confetti: a handful of small colored boxes that pop out and fall - the 3D equivalent of the 2D
// games' celebration effects, kept simple (no particle system library, plain meshes + gravity). ----
const confetti = []
function spawnConfetti(at, count = 40) {
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.4, 0.4),
      new THREE.MeshStandardMaterial({ color: Math.random() * 0xffffff }),
    )
    mesh.position.copy(at)
    scene.add(mesh)
    confetti.push({ mesh, v: new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 8 + 4, (Math.random() - 0.5) * 10), born: performance.now() })
  }
}
function updateConfetti(dt) {
  const now = performance.now()
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i]
    p.v.y -= 12 * dt
    p.mesh.position.addScaledVector(p.v, dt)
    p.mesh.rotation.x += dt * 4; p.mesh.rotation.y += dt * 3
    if (now - p.born > 2500) { scene.remove(p.mesh); confetti.splice(i, 1) }
  }
}

// Stage E debug overlay content - only formatted while visible (cheap to skip otherwise).
function updateDebugOverlay() {
  if (!debugVisible) return
  const pose = poseLive()
  const fmt = (p) => p ? `[${p[0].toFixed(2)}, ${p[1].toFixed(2)}]` : '-'
  const [, lsh, rsh, , , lwr, rwr] = lastBody || []
  debugEl.textContent =
    `pose: ${pose ? 'LIVE' : 'no signal (keyboard)'}\n` +
    `bank  ${bank.toFixed(2)} / ${MAX_BANK.toFixed(2)}  (raw ${poseBank.toFixed(2)})\n` +
    `pitch ${pitch.toFixed(2)} / ${MAX_PITCH.toFixed(2)}  (raw ${posePitch.toFixed(2)})\n` +
    `flap  rate ${poseFlapRate.toFixed(2)}  (deadzone ${FLAP_RATE_DEADZONE} / saturation ${FLAP_RATE_SATURATION})\n` +
    `speed ${speed.toFixed(1)}  vy ${vy.toFixed(1)}\n` +
    `Lwr ${fmt(lwr)}  Rwr ${fmt(rwr)}\n` +
    `Lsh ${fmt(lsh)}  Rsh ${fmt(rsh)}\n` +
    `BANK_GAIN ${BANK_GAIN}  PITCH_GAIN ${PITCH_GAIN}`
}

const banner = document.getElementById('banner')
const scoreEl = document.getElementById('score')
window.DEBUG = {
  scene, camera, onPose, // onPose exposed so a phone-less test can feed a synthetic body-keypoint array directly
  get creature() { return creature },
  get physics() { return { bank, pitch, speed, vy } },
  get finished() { return finished },
  get score() { return score },
  MAZE, OBSTACLES, LEVELS, levelIdx, // exposed for testing - runtime hit/scored state lives on each MAZE/OBSTACLES entry
  get pose() { return { live: poseLive(), poseBank, posePitch, poseFlapRate } },
  get debugVisible() { return debugVisible },
  set debugVisible(v) { debugVisible = !!v; debugEl.style.display = debugVisible ? 'block' : 'none' },
  get debugText() { return debugEl.textContent },
}

let last = performance.now()
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now
  if (finished) {
    if (now - finishAt > CELEBRATE_MS) {
      const isLast = levelIdx === LEVELS.length - 1
      const nextLevel = isLast ? 1 : levelIdx + 2 // levelIdx is 0-based, the URL param is 1-based
      const nextScore = isLast ? 0 : score // a fresh run once you've cycled through every level, otherwise carry the score forward
      location.href = `flight-test.html?level=${nextLevel}&score=${nextScore}`
    }
  }
  else stepPhysics(dt)
  updateWings(now)
  updateConfetti(dt)
  updateDebugOverlay()
  waterTex.offset.y -= dt * 0.4 // scrolling texture offset - a flowing-water look for the price of one number per frame
  scoreEl.textContent = `Level ${levelIdx + 1}: ${level.name}   Score: ${score}`
  camera.position.set(creature.position.x + CHASE_OFFSET.x, creature.position.y + CHASE_OFFSET.y, creature.position.z + CHASE_OFFSET.z)
  camera.lookAt(creature.position.x, creature.position.y + 0.5, creature.position.z)
  renderer.render(scene, camera)
  requestAnimationFrame(tick)
}
requestAnimationFrame(tick)
</script>
