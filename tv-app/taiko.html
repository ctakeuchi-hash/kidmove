<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiko Drums — Kids Motion Game</title>
<style>
  html,body{margin:0;height:100%;background:#1a0b2a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;top:8px;left:12px;margin:0;color:#e8dcff;font:14px system-ui;opacity:.85;max-width:70vw}
  #ver{position:fixed;right:12px;bottom:8px;color:#9b8bb0;font:14px monospace}
  #spotifyBtn{position:fixed;top:52px;left:12px;font:600 15px system-ui;padding:7px 14px;border-radius:20px;border:2px solid #1ed76066;background:#111a;color:#1ed760;cursor:pointer}
  #spotifyPanel{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;z-index:10;font:16px system-ui;color:#fff}
  #spotifyPanelBody{background:#1a1a2e;padding:26px 32px;border-radius:20px;max-width:560px;width:88vw;max-height:82vh;overflow:auto;text-align:center;box-shadow:0 10px 40px #000a}
  #spotifyPanelBody input{width:88%;padding:10px;border-radius:10px;border:none;font:16px system-ui}
  #spotifyPanelBody button{font:700 16px system-ui;padding:10px 20px;border-radius:14px;border:none;background:#1ed760;color:#000;cursor:pointer;margin:6px 4px}
  #spotifyPanelBody button.ghost{background:none;border:2px solid #fff5;color:#fff;font-weight:600}
  #spotifyPanelBody button:disabled{opacity:.4;cursor:default}
  .spTrack{padding:8px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left}
  .spTrack:hover{background:#ffffff14}
</style>
<pre id="hint">Drum along to the beat! The drummer copies your arms - swing a hand down when a note lands on the drum: left hand for the blue (left) side, right hand for the red (right) side. No phone: F/J keys or click the left/right half. Esc for menu.</pre>
<button id="spotifyBtn">🎵 Spotify</button>
<div id="spotifyPanel"><div id="spotifyPanelBody"></div></div>
<div id="ver"></div>
<canvas id="c"></canvas>
<script>
// ---- A Taiko-no-Tatsujin-style rhythm game: notes scroll right-to-left down two lanes and you "drum" them by
// swinging a hand down when they reach the ring, same phone-tracks-your-body pipeline as the rest of tv-app
// (kp messages relayed from phone-app, see onPose below - reuses the same BODY keypoint order flight-test.html
// reads, no phone-app or server changes needed). No fail state, same philosophy as Trace/Jump/Flight: the
// backing beat always plays in full regardless of how well you hit it, so it always sounds like a real song;
// good timing just adds score, sparkle and a happier drum face. 4 built-in songs of increasing tempo/density,
// auto-advancing on finish and carrying score forward, looping back to song 1 with a fresh score after the last
// - same convention as flight-test.html's LEVELS. ?song=2 jumps straight to a song. The 🎵 Spotify button (see
// the "Optional: Spotify" section below) swaps the synthesized beat for a real track a grown-up picks - fully
// additive, never required.
fetch('/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => document.getElementById('ver').textContent = 'v' + v.version).catch(() => {})

// ---- Songs: bars are 8-character strings, one char per eighth note (2 chars per beat, 4/4 time).
// '.' = rest, 'L' = left-hand note, 'R' = right-hand note, 'B' = both hands at once. ----
function altBars(a, b, n) { const out = []; for (let i = 0; i < n; i++) out.push(a, b); return out }
function notesFromBars(bpm, bars) {
  const stepMs = 60000 / bpm / 2, notes = []
  let step = 0
  for (const bar of bars) {
    for (const ch of bar) {
      if (ch === 'L' || ch === 'R') notes.push({ t: step * stepMs, lane: ch === 'L' ? 0 : 1, hit: false, missed: false, played: false })
      else if (ch === 'B') { notes.push({ t: step * stepMs, lane: 0, hit: false, missed: false, played: false }); notes.push({ t: step * stepMs, lane: 1, hit: false, missed: false, played: false }) }
      step++
    }
  }
  return { notes, totalMs: step * stepMs }
}
function buildSong(name, bpm, bars, theme) { const { notes, totalMs } = notesFromBars(bpm, bars); return { name, bpm, notes, totalMs, theme } }
const SONGS = [ // bg = festival sky, top to horizon
  buildSong('Sunshine Beat', 78, Array(8).fill('L...R...'), { bg: ['#ffd27a', '#ff8a5c'] }),
  buildSong('Bouncy Bus', 96, altBars('L.R.L.R.', 'L.RBL.R.', 6), { bg: ['#8fd3ff', '#3f7fd6'] }),
  buildSong('Jungle Groove', 112, altBars('L.R.L.RB', 'L.RL.R.B', 8), { bg: ['#2f7d5b', '#103a2a'] }),
  buildSong('Rocket Rhythm', 130, altBars('LRLRLRLR', 'LRBLRB..', 10), { bg: ['#3a2370', '#0b0722'] }),
]
const params = new URLSearchParams(location.search)
let score = parseInt(params.get('score')) || 0

const cv = document.getElementById('c'), ctx = cv.getContext('2d')
let W, H
// ---- Layout: the whole stage (drums, drummer, note columns) is sized off one unit `u`, so it scales with the
// window. One big drum in front of the drummer: its left half = left hand (lane 0), right half = right hand. The
// drummer mirrors you like a mirror would, so "hit the left side with your left hand" needs no explaining. ----
let u, cx, floorY, headY, drumX
function resize() {
  W = cv.width = innerWidth; H = cv.height = innerHeight
  u = Math.min(H / 100, W / 120); cx = W / 2; floorY = H - 12 * u
  headY = floorY - 32 * u; drumX = [cx - 16 * u, cx + 16 * u] // headY = drum-head level; drumX = where each lane's notes land on it
}
addEventListener('resize', resize); resize()
const LANE_COLOR = ['#2f8cff', '#ff4b3a'], LANE_DARK = ['#0b3f86', '#9c1b10']

// ---- Timing: a short lead-in count-in before the beat starts, matching the STAGES text below. `song`/`songIdx`/
// `mode`/`t0` are mutable - startBuiltinSong() and startSpotifySong() (below) both (re)initialize them, so picking
// a Spotify track mid-session swaps the running game without a page reload. ----
const COUNTDOWN_MS = 2800, NOTE_TRAVEL_MS = 1700, HIT_WINDOW_MS = 260, TAIL_MS = 1200, CELEBRATE_MS = 3000
const STAGES = ['3', '2', '1', 'Drum!']
let mode = 'builtin', songIdx = 0, song = null, t0 = 0
let phase = 'countdown', celebrateAt = null, combo = 0, bestCombo = 0
const drumPulse = [0, 0]
const pulse = (l, amt) => { drumPulse[l] = Math.max(drumPulse[l], amt) }
function startBuiltinSong(idx) {
  mode = 'builtin'; songIdx = Math.max(0, Math.min(SONGS.length - 1, idx)); song = SONGS[songIdx]
  combo = 0; bestCombo = 0; phase = 'countdown'; t0 = performance.now() + COUNTDOWN_MS
}

// ---- Audio: everything synthesised, no files (see tv-app/index.html's sfx for the same convention). The
// backing beat (drumHit) always plays on schedule in builtin mode; a correct swing always layers a bright chime
// on top, in both modes (a real Spotify track supplies its own beat, so drumHit is skipped there - see draw()). ----
let actx, muted = false
const audioOn = () => actx && actx.state === 'running' && !muted
function tone(f, t0 = 0, dur = 0.3, vol = 0.2, type = 'triangle') {
  if (!audioOn()) return
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0
  o.type = type; o.frequency.value = f
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur)
}
function drumHit(lane) {
  if (!audioOn()) return
  const t = actx.currentTime, f = lane === 0 ? 150 : 440
  const o = actx.createOscillator(), g = actx.createGain()
  o.type = lane === 0 ? 'sine' : 'triangle'
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.14)
  g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.16)
}
const CHIME_NOTES = [659.25, 783.99, 880, 1046.5, 1318.5]
const hitChime = (c) => tone(CHIME_NOTES[Math.min(c, CHIME_NOTES.length - 1)], 0, 0.28, 0.18, 'sine')
const songChime = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.4, 0.22))
const unlock = () => { actx ||= new AudioContext(); actx.resume() }

// ---- Feedback: sparkles + floating text + confetti, same simple particle system as tv-app/index.html. ----
const fx = [], confetti = []
function spark(x, y, n, c) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7 - 1, life: 0, max: 500 + Math.random() * 400, c }) }
function popText(text, x, y, c) { fx.push({ text, x, y, vx: 0, vy: -1.4, life: 0, max: 1100, c }) }
function drawFx(dt) {
  for (const f of fx) {
    f.life += dt * 1000; f.x += f.vx; f.y += f.vy
    if (f.text) { ctx.globalAlpha = Math.max(0, 1 - f.life / f.max); ctx.font = '800 40px system-ui'; ctx.textAlign = 'center'
      ctx.fillStyle = f.c; ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.fillText(f.text, f.x, f.y); ctx.shadowBlur = 0 }
    else { f.vy += 0.22; ctx.globalAlpha = Math.max(0, 1 - f.life / f.max); ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, 7); ctx.fill() }
  }
  ctx.globalAlpha = 1
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life > fx[i].max) fx.splice(i, 1)
}
function burstConfetti(n) { for (let i = 0; i < n; i++) confetti.push({ x: W / 2, y: H / 2, vx: (Math.random() - .5) * 24, vy: -Math.random() * 20 - 4,
  r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: `hsl(${Math.random() * 360} 90% 60%)`, s: 8 + Math.random() * 10 }) }
function drawConfetti() {
  for (const c of confetti) { c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.r += c.vr
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore() }
  while (confetti.length && confetti[0].y > H + 50) confetti.shift()
}

// ---- Hitting a note: the nearest not-yet-resolved note in that lane, within HIT_WINDOW_MS either side of now.
// Missing entirely is silent and score-neutral (no fail state) - the beat played on regardless. ----
function strike(lane) {
  if (phase !== 'playing') return
  const elapsed = performance.now() - t0
  let best = null, bestDist = Infinity
  for (const n of song.notes) {
    if (n.lane !== lane || n.hit || n.missed) continue
    const d = Math.abs(elapsed - n.t)
    if (d <= HIT_WINDOW_MS && d < bestDist) { best = n; bestDist = d }
  }
  pulse(lane, 1); swingAt[lane] = performance.now()
  if (!best) return
  best.hit = true; combo++; bestCombo = Math.max(bestCombo, combo); score += 10 + Math.min(combo, 10)
  hitChime(Math.min(combo, 4)); happyUntil = performance.now() + 350
  spark(drumX[lane], headY, 14, LANE_COLOR[lane]); spark(drumX[lane], headY, 6, '#ffe27a')
  popText(combo > 1 ? `${combo} combo!` : bestDist <= 90 ? 'Great!' : 'Good!', drumX[lane], headY - 14 * u, '#fff')
  if (combo && combo % 10 === 0) burstConfetti(60)
}

// ---- Input: phone pose (a quick downward swing of either wrist), keyboard F/J, or a click on the top/bottom
// half - same "phone optional" fallback as flight-test.html's keyboard controls. ----
const POSE_TIMEOUT_MS = 500, STRIKE_VELOCITY = 1.8, STRIKE_COOLDOWN_MS = 220
const wristHist = [[], []], lastStrikeAt = [-1e9, -1e9]
let lastPoseAt = -1e9
// The drummer's arms copy yours: each wrist relative to its shoulder, in shoulder-widths (so it doesn't matter how
// far from the phone you stand), stored as [outward, down] in mirror space - see handTarget() for how that becomes
// a hand position on screen. tilt = shoulder slope, so leaning to one side leans the drummer too.
const poseRel = [[0.45, -0.75], [0.45, -0.75]]
let poseTilt = 0
// b = phone's full body keypoint array, phone-app's BODY order: [nose, Lsh, Rsh, Lel, Rel, Lwr, Rwr, Lhip, Rhip, ...]
// ar = camera aspect ratio (x is a fraction of width, y of height, so x needs * ar to be in the same units as y).
function onPose(b, ar = 1) {
  const now = performance.now(); lastPoseAt = now
  const sw = Math.hypot((b[2][0] - b[1][0]) * ar, b[2][1] - b[1][1]) || 0.001
  poseTilt = poseTilt * 0.7 + Math.max(-0.3, Math.min(0.3, Math.atan2(b[2][1] - b[1][1], sw))) * 0.3
  ;[5, 6].forEach((idx, lane) => {
    const y = b[idx][1], sh = b[idx - 4], side = lane ? 1 : -1 // camera x is unmirrored: -dx is screen-space
    const rel = [-(b[idx][0] - sh[0]) * ar / sw * side, (y - sh[1]) / sw]
    poseRel[lane][0] = poseRel[lane][0] * 0.5 + rel[0] * 0.5; poseRel[lane][1] = poseRel[lane][1] * 0.5 + rel[1] * 0.5
    const h = wristHist[lane]; h.push({ t: now, y }); while (h.length && now - h[0].t > 150) h.shift()
    if (h.length < 2) return
    const vel = (y - h[0].y) / ((now - h[0].t) / 1000) // normalized y-units/sec, positive = swinging down
    if (vel > STRIKE_VELOCITY && now - lastStrikeAt[lane] > STRIKE_COOLDOWN_MS) { lastStrikeAt[lane] = now; strike(lane) }
  })
}
const ws = new WebSocket(`wss://${location.host}/?role=tv`)
ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'kp') { const b = (m.ps?.[0] || m).b; if (b) onPose(b, m.ar || 1) } }
addEventListener('pointerdown', (e) => { unlock(); if (e.target.closest('#spotifyPanel, #spotifyBtn')) return; if (e.clientX < W / 2) strike(0); else strike(1) })
addEventListener('keydown', (e) => {
  unlock()
  if (document.getElementById('spotifyPanel').style.display === 'flex') return // don't drum while typing/tapping in the panel
  if (e.key === 'Escape') location.href = 'index.html'
  else if (e.key === 'f' || e.key === 'F' || e.key === 'ArrowLeft') strike(0)
  else if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowRight') strike(1)
  else if (e.key === 'm' || e.key === 'M') muted = !muted
})

// ---- Optional: play a real Spotify track instead of the built-in synthesized song. Fully additive - nothing
// here runs until the 🎵 button is pressed, and if it fails (no Client ID, no Premium, DRM unsupported, network
// blocked) the built-in songs above are untouched. Uses Authorization Code + PKCE, which needs no client secret
// and so is safe to run entirely in this static page - no server changes. Spotify no longer gives new apps
// access to beat/tempo analysis, so instead of guessing, a grown-up taps out the tempo after picking a song;
// the note chart is generated from that tempo and the track's real length (duration_ms comes free from search,
// no analysis API needed). See README for the one-time Spotify Developer Dashboard setup this requires. ----
const SPOTIFY_REDIRECT = location.origin + location.pathname
const SPOTIFY_SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state'
const spGet = (k) => localStorage.getItem('kmg_sp_' + k)
const spSet = (k, v) => localStorage.setItem('kmg_sp_' + k, v)
function b64url(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') }
function randString(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a) }
async function pkceChallenge(verifier) { return b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))) }

async function spotifyLogin() {
  const clientId = spGet('client_id'); if (!clientId) return spotifyPanelShow('setup')
  const verifier = randString(64), state = randString(16)
  spSet('verifier', verifier); spSet('state', state)
  const challenge = await pkceChallenge(verifier)
  const u = new URL('https://accounts.spotify.com/authorize')
  u.search = new URLSearchParams({ client_id: clientId, response_type: 'code', redirect_uri: SPOTIFY_REDIRECT,
    scope: SPOTIFY_SCOPES, code_challenge_method: 'S256', code_challenge: challenge, state }).toString()
  location.href = u.toString()
}
async function spotifyHandleRedirect() { // runs once on load; no-op unless we just came back from the Spotify login page
  const code = params.get('code'), state = params.get('state')
  if (!code) return
  history.replaceState(null, '', location.pathname + (score ? `?score=${score}` : '')) // scrub the one-time code before a reload could resend it
  if (state !== spGet('state')) return
  const clientId = spGet('client_id'), verifier = spGet('verifier')
  try {
    const body = new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: SPOTIFY_REDIRECT, client_id: clientId, code_verifier: verifier })
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
    if (!r.ok) throw new Error('token exchange failed')
    const tok = await r.json()
    spSet('access_token', tok.access_token); spSet('refresh_token', tok.refresh_token); spSet('expires_at', Date.now() + tok.expires_in * 1000)
    spotifyPanelShow('search')
  } catch { spotifyPanelShow('login') }
}
async function spotifyToken() {
  if (Date.now() < (+spGet('expires_at') || 0) - 30000) return spGet('access_token')
  const refresh = spGet('refresh_token'), clientId = spGet('client_id')
  if (!refresh || !clientId) return null
  const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: refresh, client_id: clientId })
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
  if (!r.ok) return null
  const tok = await r.json()
  spSet('access_token', tok.access_token); spSet('expires_at', Date.now() + tok.expires_in * 1000)
  if (tok.refresh_token) spSet('refresh_token', tok.refresh_token)
  return tok.access_token
}
async function spotifySearch(q) {
  const token = await spotifyToken(); if (!token) throw new Error('not logged in')
  const r = await fetch(`https://api.spotify.com/v1/search?type=track&limit=8&q=${encodeURIComponent(q)}`, { headers: { Authorization: `Bearer ${token}` } })
  if (!r.ok) throw new Error('search failed')
  return (await r.json()).tracks.items
}
let spPlayer = null, spDeviceId = null
function spotifyLoadSdk() {
  return new Promise((resolve) => {
    if (window.Spotify) return resolve()
    window.onSpotifyWebPlaybackSDKReady = resolve
    const s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js'; document.head.appendChild(s)
  })
}
async function spotifyEnsurePlayer() {
  if (spPlayer && spDeviceId) return
  await spotifyLoadSdk()
  spPlayer = new Spotify.Player({ name: 'Kids Motion Game TV', getOAuthToken: (cb) => spotifyToken().then(cb), volume: 0.75 })
  await new Promise((resolve, reject) => {
    spPlayer.addListener('ready', ({ device_id }) => { spDeviceId = device_id; resolve() })
    spPlayer.addListener('initialization_error', ({ message }) => reject(new Error(message)))
    spPlayer.addListener('authentication_error', ({ message }) => reject(new Error(message)))
    spPlayer.addListener('account_error', ({ message }) => reject(new Error('Spotify Premium is required: ' + message)))
    spPlayer.connect()
  })
}
async function spotifyPlayTrack(uri) {
  await spotifyEnsurePlayer()
  const token = await spotifyToken()
  const r = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${spDeviceId}`, {
    method: 'PUT', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ uris: [uri] }) })
  if (!r.ok && r.status !== 204) throw new Error('playback failed (Premium required)')
}
function startSpotifySong(track, bpm) {
  mode = 'spotify'
  const bars = altBars('L.R.L.R.', 'L.RBL.R.', Math.ceil(track.duration_ms / (60000 / bpm / 2 * 8) / 2) + 1)
  const { notes } = notesFromBars(bpm, bars)
  song = { name: track.name, bpm, notes, totalMs: track.duration_ms, theme: { bg: ['#1a1a2e', '#0f3460'] } }
  combo = 0; bestCombo = 0; phase = 'countdown'; t0 = performance.now() + COUNTDOWN_MS
  spotifyPlayTrack(track.uri).catch((e) => { console.warn('Spotify playback failed:', e); popText('Spotify play failed - check Premium login', W / 2, H * 0.5, '#ff8') })
}

// ---- Spotify setup panel: plain DOM (not canvas) so text input/search results are easy - see the CSS above. ----
const spPanel = document.getElementById('spotifyPanel'), spPanelBody = document.getElementById('spotifyPanelBody')
const spotifyPanelHide = () => { spPanel.style.display = 'none' }
function spotifyPanelShow(state, data) {
  spPanel.style.display = 'flex'
  if (state === 'setup') spPanelBody.innerHTML = `
    <h2>🎵 Connect Spotify</h2>
    <p style="opacity:.8;line-height:1.5">Needs a free Spotify Developer app (one-time setup by a grown-up) and a Premium account for full songs - see the README.</p>
    <input id="spClientId" placeholder="Paste your Spotify Client ID">
    <div><button id="spSaveId">Save &amp; Connect</button><button id="spClose" class="ghost">Cancel</button></div>`
  else if (state === 'login') spPanelBody.innerHTML = `
    <h2>🎵 Connect Spotify</h2>
    <p style="opacity:.8">Log in with your Spotify account (Premium needed for full songs).</p>
    <div><button id="spLogin">Log in with Spotify</button><button id="spClose" class="ghost">Cancel</button></div>`
  else if (state === 'search') spPanelBody.innerHTML = `
    <h2>🎵 Pick a song</h2>
    <div><input id="spQuery" placeholder="Search a song…"><button id="spSearchBtn">Search</button></div>
    <div id="spResults" style="margin-top:10px;max-height:42vh;overflow:auto"></div>
    <div><button id="spClose" class="ghost">Close</button></div>`
  else if (state === 'tempo') spPanelBody.innerHTML = `
    <h2>🥁 ${data.track.name}</h2>
    <p style="opacity:.8;margin-top:-6px">${data.track.artists.map((a) => a.name).join(', ')}</p>
    <p>Tap the button on the beat, at least 4 times, then hit Start!</p>
    <button id="spTap" style="font:900 26px system-ui;padding:22px 38px;border-radius:50%">TAP</button>
    <p id="spBpm" style="font:700 22px system-ui;color:#ffd23f">BPM: --</p>
    <div><button id="spStart" disabled>Start! 🥁</button><button id="spClose" class="ghost">Cancel</button></div>`
  document.getElementById('spClose').onclick = spotifyPanelHide
  if (state === 'setup') document.getElementById('spSaveId').onclick = () => {
    const id = document.getElementById('spClientId').value.trim(); if (id) { spSet('client_id', id); spotifyLogin() }
  }
  else if (state === 'login') document.getElementById('spLogin').onclick = spotifyLogin
  else if (state === 'search') {
    const results = document.getElementById('spResults')
    const doSearch = async () => {
      const q = document.getElementById('spQuery').value.trim(); if (!q) return
      results.textContent = 'Searching…'
      try {
        const tracks = await spotifySearch(q)
        results.innerHTML = tracks.map((t, i) => `<div class="spTrack" data-i="${i}">
          <img src="${t.album.images[2]?.url || t.album.images[0]?.url || ''}" style="width:44px;height:44px;border-radius:6px">
          <div><b>${t.name}</b><br><span style="opacity:.7">${t.artists.map((a) => a.name).join(', ')}</span></div></div>`).join('') || 'No results'
        results.querySelectorAll('.spTrack').forEach((el) => el.onclick = () => spotifyPanelShow('tempo', { track: tracks[+el.dataset.i] }))
      } catch { results.textContent = 'Could not search - are you logged in?' }
    }
    document.getElementById('spSearchBtn').onclick = doSearch
    document.getElementById('spQuery').addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch() })
  } else if (state === 'tempo') {
    const taps = [], startBtn = document.getElementById('spStart')
    document.getElementById('spTap').onclick = () => {
      taps.push(performance.now()); while (taps.length > 8) taps.shift()
      if (taps.length < 2) return
      const intervals = taps.slice(1).map((v, i) => v - taps[i])
      const bpm = Math.max(40, Math.min(200, Math.round(60000 / (intervals.reduce((a, b) => a + b, 0) / intervals.length))))
      document.getElementById('spBpm').textContent = `BPM: ${bpm}`
      if (taps.length >= 4) { startBtn.disabled = false; startBtn.dataset.bpm = bpm }
    }
    startBtn.onclick = () => { const bpm = +startBtn.dataset.bpm; spotifyPanelHide(); startSpotifySong(data.track, bpm) }
  }
}
document.getElementById('spotifyBtn').onclick = async () => {
  unlock()
  if (!spGet('client_id')) return spotifyPanelShow('setup')
  spotifyPanelShow((await spotifyToken()) ? 'search' : 'login')
}

// ---- Render: a summer-festival (matsuri) stage - paper lanterns, wooden boards, a red-and-white kohaku skirt -
// with two nagado-daiko drums and a drummer in a happi coat and twisted hachimaki headband. All drawn in canvas,
// no image files, same as the rest of tv-app. ----
const SKIN = '#f6c9a0', SKIN_DARK = '#d99a6c', COAT = '#21346e', COAT_DARK = '#16234d', STICK = '#f0cf8f'
const NOTE_R = () => 4.4 * u
function path(pts) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath() }
function seg(x1, y1, x2, y2, w, c, cap = 'round') { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = cap; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke() }

function drawLantern(x, y, s, now) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(now / 900 + x * 0.01) * 0.06)
  const glow = ctx.createRadialGradient(0, s * 1.2, 0, 0, s * 1.2, s * 3)
  glow.addColorStop(0, 'rgba(255,190,90,.45)'); glow.addColorStop(1, 'rgba(255,190,90,0)')
  ctx.fillStyle = glow; ctx.fillRect(-s * 3, -s * 2, s * 6, s * 6.4)
  seg(0, -s * 0.4, 0, 0, s * 0.08, '#222')
  const body = ctx.createRadialGradient(-s * 0.2, s, s * 0.1, 0, s * 1.2, s)
  body.addColorStop(0, '#ff8a65'); body.addColorStop(1, '#c62828')
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, s * 1.2, s * 0.8, s, 0, 0, 7); ctx.fill()
  ctx.strokeStyle = 'rgba(90,10,10,.45)'; ctx.lineWidth = s * 0.05
  for (const k of [-0.6, -0.3, 0, 0.3, 0.6]) { ctx.beginPath(); ctx.ellipse(0, s * 1.2 + k * s, s * 0.8 * Math.sqrt(1 - k * k), s * 0.08, 0, 0, 7); ctx.stroke() }
  ctx.fillStyle = '#2a1a12'; ctx.fillRect(-s * 0.42, 0, s * 0.84, s * 0.32); ctx.fillRect(-s * 0.42, s * 2.08, s * 0.84, s * 0.32)
  ctx.fillStyle = '#fff3'; ctx.font = `900 ${s * 0.75}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('祭', 0, s * 1.25)
  ctx.textBaseline = 'alphabetic'; ctx.restore()
}

function drawBackground(now) {
  const g = ctx.createLinearGradient(0, 0, 0, floorY)
  g.addColorStop(0, song.theme.bg[0]); g.addColorStop(1, song.theme.bg[1])
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  // spotlight on the drummer
  const spot = ctx.createRadialGradient(cx, floorY - 30 * u, 0, cx, floorY - 30 * u, 70 * u)
  spot.addColorStop(0, 'rgba(255,240,200,.35)'); spot.addColorStop(1, 'rgba(255,240,200,0)')
  ctx.fillStyle = spot; ctx.fillRect(0, 0, W, H)
  // lantern string sagging across the top
  const sagY = (x) => 3 * u + 6 * u * (1 - ((2 * x / W) - 1) ** 2)
  ctx.strokeStyle = '#2228'; ctx.lineWidth = 0.4 * u; ctx.beginPath()
  for (let x = 0; x <= W; x += 20) x ? ctx.lineTo(x, sagY(x)) : ctx.moveTo(x, sagY(x))
  ctx.stroke()
  for (const f of [0.05, 0.15, 0.25, 0.75, 0.85, 0.95]) drawLantern(f * W, sagY(f * W), 3.2 * u, now)
  // stage boards
  const wood = ctx.createLinearGradient(0, floorY, 0, floorY + 5 * u)
  wood.addColorStop(0, '#c08a52'); wood.addColorStop(1, '#8a5a2b')
  ctx.fillStyle = wood; ctx.fillRect(0, floorY, W, 5 * u)
  ctx.strokeStyle = '#6b4220'; ctx.lineWidth = 0.25 * u
  for (const k of [1.4, 3]) { ctx.beginPath(); ctx.moveTo(0, floorY + k * u); ctx.lineTo(W, floorY + k * u); ctx.stroke() }
  // kohaku (red & white) stage skirt
  const top = floorY + 5 * u, sw = 4 * u
  for (let i = 0, x = 0; x < W; i++, x += sw) { ctx.fillStyle = i % 2 ? '#fff' : '#d32f2f'; ctx.fillRect(x, top, sw + 1, H - top) }
  ctx.fillStyle = '#0003'; ctx.fillRect(0, top, W, 0.8 * u)
}

function drawColumn(l) { // the track a note falls down, ending in the landing ring on the drum head
  const x = drumX[l], w = NOTE_R() * 1.4
  const g = ctx.createLinearGradient(0, 0, 0, headY)
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.22)')
  ctx.fillStyle = g; ctx.fillRect(x - w, 0, w * 2, headY)
}
function drawRing(l) {
  const x = drumX[l], r = NOTE_R() * 1.25
  ctx.lineWidth = 0.7 * u; ctx.strokeStyle = `rgba(255,255,255,${0.75 + drumPulse[l] * 0.25})`
  ctx.beginPath(); ctx.arc(x, headY, r * (1 + drumPulse[l] * 0.25), 0, 7); ctx.stroke()
  ctx.strokeStyle = LANE_COLOR[l]; ctx.lineWidth = 0.35 * u; ctx.beginPath(); ctx.arc(x, headY, r * 0.82, 0, 7); ctx.stroke()
}
function drawNote(x, y, lane, missed) {
  const r = NOTE_R()
  ctx.globalAlpha = missed ? 0.35 : 1
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#222'; ctx.fill()
  ctx.beginPath(); ctx.arc(x, y, r * 0.86, 0, 7); ctx.fillStyle = '#fff'; ctx.fill()
  const g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.1, x, y, r * 0.72)
  g.addColorStop(0, missed ? '#bbb' : '#fff8'); g.addColorStop(0.25, missed ? '#999' : LANE_COLOR[lane]); g.addColorStop(1, missed ? '#777' : LANE_DARK[lane])
  ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 7); ctx.fillStyle = g; ctx.fill()
  ctx.fillStyle = '#111' // a little Taiko-style face
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(x + d * r * 0.28, y - r * 0.08, r * 0.09, 0, 7); ctx.fill() }
  ctx.strokeStyle = '#111'; ctx.lineWidth = r * 0.08; ctx.beginPath(); ctx.arc(x, y + r * 0.08, r * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke()
  ctx.globalAlpha = 1
}
function drawNotes(elapsed) {
  const fall = headY + 6 * u
  for (const n of song.notes) {
    if (n.hit) continue
    const dt = n.t - elapsed
    if (dt > NOTE_TRAVEL_MS || dt < -HIT_WINDOW_MS - 50) continue
    drawNote(drumX[n.lane], headY - (dt / NOTE_TRAVEL_MS) * fall, n.lane, n.missed)
  }
}

const HEAD_RX = () => 30 * u, HEAD_RY = () => 9 * u
function drawDrum() { // nagado-daiko: lacquered barrel, brass tacks, a ring handle, on a low wooden stand
  const x = cx, rx = HEAD_RX(), ry = HEAD_RY(), top = headY, bot = floorY - 6 * u, mid = (top + bot) / 2
  // stand
  seg(x - rx * 0.7, bot - u, x - rx * 0.95, floorY, 1.6 * u, '#3b2414'); seg(x + rx * 0.7, bot - u, x + rx * 0.95, floorY, 1.6 * u, '#3b2414')
  seg(x - rx * 0.85, floorY - 3 * u, x + rx * 0.85, floorY - 3 * u, 1.2 * u, '#4a2e1a')
  // barrel
  ctx.beginPath(); ctx.moveTo(x - rx, top)
  ctx.quadraticCurveTo(x - rx * 1.16, mid, x - rx, bot)
  ctx.ellipse(x, bot, rx, ry, 0, Math.PI, 0, true)
  ctx.quadraticCurveTo(x + rx * 1.16, mid, x + rx, top); ctx.closePath()
  const wood = ctx.createLinearGradient(x - rx, 0, x + rx, 0)
  wood.addColorStop(0, '#3a160a'); wood.addColorStop(0.35, '#a8461f'); wood.addColorStop(0.5, '#c4602e'); wood.addColorStop(1, '#3a160a')
  ctx.fillStyle = wood; ctx.fill()
  ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(40,10,0,.35)'; ctx.lineWidth = 0.25 * u
  for (const k of [-0.66, -0.33, 0, 0.33, 0.66]) { ctx.beginPath(); ctx.moveTo(x + k * rx, top); ctx.quadraticCurveTo(x + k * rx * 1.16, mid, x + k * rx, bot + ry); ctx.stroke() }
  ctx.restore()
  // brass tacks under the top rim and above the bottom rim
  for (const [yy, k] of [[top + 1.3 * u, 1], [bot - 1.3 * u, 1]]) for (let i = 1; i < 24; i++) {
    const a = Math.PI * i / 24, tx = x - Math.cos(a) * rx * k * 0.98, ty = yy + Math.sin(a) * ry
    ctx.beginPath(); ctx.arc(tx, ty, 0.55 * u, 0, 7); ctx.fillStyle = '#e8c35a'; ctx.fill(); ctx.strokeStyle = '#7a5a12'; ctx.lineWidth = 0.15 * u; ctx.stroke()
  }
  // ring handle
  ctx.strokeStyle = '#d8b04a'; ctx.lineWidth = 0.7 * u; ctx.beginPath(); ctx.ellipse(x, mid + 4 * u, 2.6 * u, 3 * u, 0, 0, 7); ctx.stroke()
  ctx.fillStyle = '#d8b04a'; ctx.beginPath(); ctx.arc(x, mid + 0.9 * u, 1.1 * u, 0, 7); ctx.fill()
  // head (cowhide): each half tinted faintly in its hand's color, and flashing that color when hit
  ctx.beginPath(); ctx.ellipse(x, top, rx, ry, 0, 0, 7); ctx.fillStyle = '#5a2a10'; ctx.fill()
  ctx.beginPath(); ctx.ellipse(x, top, rx * 0.95, ry * 0.88, 0, 0, 7)
  const hide = ctx.createRadialGradient(x - rx * 0.2, top - ry * 0.3, 0, x, top, rx)
  hide.addColorStop(0, '#fff8e6'); hide.addColorStop(1, '#e2cfa2'); ctx.fillStyle = hide; ctx.fill()
  ctx.save(); ctx.clip()
  for (const l of [0, 1]) {
    ctx.globalAlpha = 0.12 + drumPulse[l] * 0.6; ctx.fillStyle = LANE_COLOR[l]
    ctx.fillRect(l ? x : x - rx, top - ry, rx, ry * 2)
  }
  ctx.globalAlpha = 1; ctx.restore()
  seg(x, top - ry * 0.85, x, top + ry * 0.85, 0.3 * u, 'rgba(90,40,10,.35)') // centre line between the halves
}

// ---- The drummer. Arms: a target hand position (copied from your pose, or a swing animation for keys/clicks),
// then 2-bone IK for the elbow, and the drumstick (bachi) carries on from the forearm - if its tip would go
// through a drum head the hand is lifted so the stick rests on the head, which is what makes it read as drumming. ----
const UPPER = 13, FORE = 12, BACHI = 14, SWING_MS = 260
const REST = [0.35, -0.75], STRIKE = [0.4, 1.3] // [outward, down] in shoulder-widths, same space as poseRel
const swingAt = [-1e9, -1e9], hands = [null, null]
let happyUntil = 0, tilt = 0, blinkAt = 0
const poseLive = (now) => now - lastPoseAt < POSE_TIMEOUT_MS
function body(now, elapsed) { // hip centre + shoulders in screen space, with a little bob to the beat
  const beat = 60000 / song.bpm, bob = phase === 'playing' ? Math.abs(Math.sin(elapsed / beat * Math.PI)) * 0.8 * u : 0
  const hx = cx, hy = floorY - 30 * u + bob, c = Math.cos(tilt), s = Math.sin(tilt)
  const sh = [-1, 1].map((d) => { const lx = d * 10 * u, ly = -26 * u; return [hx + lx * c - ly * s, hy + lx * s + ly * c] })
  return { hx, hy, sh }
}
function handTarget(l, now, sh) {
  let rel = poseRel[l]
  if (!poseLive(now)) {
    const p = (now - swingAt[l]) / SWING_MS
    const k = p < 0 || p >= 1 ? 0 : p < 0.35 ? 1 - (1 - p / 0.35) ** 2 : 1 - (p - 0.35) / 0.65
    rel = [REST[0] + (STRIKE[0] - REST[0]) * k, REST[1] + (STRIKE[1] - REST[1]) * k + Math.sin(now / 400 + l * 2) * 0.05]
  }
  const side = l ? 1 : -1, toward = Math.max(0, Math.min(1, rel[1] / 1.2)) // the lower the hand, the more it drifts over its half of the drum
  return [sh[0] + side * (rel[0] * 13 + toward * 2) * u, sh[1] + rel[1] * 13 * u]
}
function solveArm(l, S, T) {
  const side = l ? 1 : -1, a = UPPER * u, b = FORE * u
  let dx = T[0] - S[0], dy = T[1] - S[1], d = Math.hypot(dx, dy) || 1
  const reach = Math.max(Math.abs(a - b) + 1, Math.min(d, (a + b) * 0.98))
  const hand = [S[0] + dx / d * reach, S[1] + dy / d * reach]
  const base = Math.atan2(dy, dx), bend = Math.acos(Math.max(-1, Math.min(1, (a * a + reach * reach - b * b) / (2 * a * reach))))
  const cands = [base + bend, base - bend].map((t) => [S[0] + Math.cos(t) * a, S[1] + Math.sin(t) * a])
  const elbow = (cands[0][0] - cands[1][0]) * side > 0 ? cands[0] : cands[1] // elbows bend outward
  let fx = hand[0] - elbow[0], fy = hand[1] - elbow[1], fl = Math.hypot(fx, fy) || 1
  fx = fx / fl + side * 0.6; fy = fy / fl + 0.55; fl = Math.hypot(fx, fy) // sticks angle outward, like a real kamae stance
  const dir = [fx / fl, fy / fl], tip = [hand[0] + dir[0] * BACHI * u, hand[1] + dir[1] * BACHI * u]
  return { elbow, hand, dir, tip }
}
function arm(l, now, sh) {
  const T = handTarget(l, now, sh[l])
  const h = hands[l] ||= T.slice(), k = 1 - Math.exp(-(1 / 60) * 30) // ease toward the target so pose jitter doesn't twitch
  h[0] += (T[0] - h[0]) * k; h[1] += (T[1] - h[1]) * k
  let r = solveArm(l, sh[l], h)
  if (r.tip[1] > headY && Math.abs(r.tip[0] - cx) < HEAD_RX() * 1.02) r = solveArm(l, sh[l], [r.hand[0], r.hand[1] - (r.tip[1] - headY)])
  return r
}
function drawArm(S, r, l) {
  const { elbow: E, hand: Hd, dir, tip } = r
  seg(E[0], E[1], Hd[0], Hd[1], 4.2 * u, SKIN_DARK); seg(E[0], E[1], Hd[0], Hd[1], 3.4 * u, SKIN) // forearm
  const at = (k) => [S[0] + (E[0] - S[0]) * k, S[1] + (E[1] - S[1]) * k], cuff = at(0.9), hem = at(0.8)
  seg(S[0], S[1], cuff[0], cuff[1], 7.4 * u, COAT_DARK); seg(S[0], S[1], cuff[0], cuff[1], 6.4 * u, COAT) // happi sleeve
  seg(hem[0], hem[1], cuff[0], cuff[1], 7.4 * u, '#f4f1ea', 'butt') // white sleeve hem
  const back = [Hd[0] - dir[0] * 2 * u, Hd[1] - dir[1] * 2 * u]
  seg(back[0], back[1], tip[0], tip[1], 2 * u, '#8a6a33'); seg(back[0], back[1], tip[0], tip[1], 1.4 * u, STICK) // bachi
  ctx.beginPath(); ctx.arc(tip[0], tip[1], 1.1 * u, 0, 7); ctx.fillStyle = STICK; ctx.fill(); ctx.strokeStyle = '#8a6a33'; ctx.lineWidth = 0.3 * u; ctx.stroke()
  ctx.beginPath(); ctx.arc(Hd[0], Hd[1], 2.5 * u, 0, 7); ctx.fillStyle = SKIN; ctx.fill(); ctx.strokeStyle = SKIN_DARK; ctx.lineWidth = 0.4 * u; ctx.stroke() // fist
}
function drawDrummer(now, { hx, hy }) {
  // legs: dark momohiki trousers in a wide drumming stance, black jika-tabi
  ctx.fillStyle = '#1b1b2f'
  path([[hx - 10 * u, hy], [hx - 0.5 * u, hy], [hx - 5.5 * u, floorY - 1.5 * u], [hx - 11.5 * u, floorY - 1.5 * u]]); ctx.fill()
  path([[hx + 10 * u, hy], [hx + 0.5 * u, hy], [hx + 5.5 * u, floorY - 1.5 * u], [hx + 11.5 * u, floorY - 1.5 * u]]); ctx.fill()
  ctx.fillStyle = '#111'
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.ellipse(hx + d * 9.5 * u, floorY - 0.8 * u, 4 * u, 1.6 * u, 0, 0, 7); ctx.fill() }
  ctx.save(); ctx.translate(hx, hy); ctx.rotate(tilt)
  // happi coat
  const coat = ctx.createLinearGradient(-11 * u, 0, 11 * u, 0)
  coat.addColorStop(0, COAT_DARK); coat.addColorStop(0.5, COAT); coat.addColorStop(1, COAT_DARK)
  ctx.fillStyle = coat; path([[-10.5 * u, -27 * u], [10.5 * u, -27 * u], [12 * u, 5 * u], [-12 * u, 5 * u]]); ctx.fill()
  ctx.fillStyle = '#ffffff22' // seigaiha-ish wave dots
  for (let y = -20; y < 4; y += 4) for (let x = -9; x <= 9; x += 4) { ctx.beginPath(); ctx.arc((x + (y % 8 ? 2 : 0)) * u, y * u, 0.9 * u, Math.PI, 0); ctx.fill() }
  ctx.fillStyle = '#f4f1ea'; path([[-3.2 * u, -27 * u], [3.2 * u, -27 * u], [0, -13 * u]]); ctx.fill() // undershirt
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 2.4 * u; ctx.lineCap = 'butt' // collar (eri) crossing into a V
  ctx.beginPath(); ctx.moveTo(-3.4 * u, -27.5 * u); ctx.lineTo(1 * u, -12 * u); ctx.lineTo(1 * u, 5 * u); ctx.stroke()
  ctx.beginPath(); ctx.moveTo(3.4 * u, -27.5 * u); ctx.lineTo(-0.2 * u, -15 * u); ctx.stroke()
  ctx.fillStyle = '#fff'; ctx.font = `900 ${2 * u}px serif`; ctx.textAlign = 'center'; ctx.fillText('祭', 1 * u, -6.5 * u)
  ctx.fillStyle = '#d32f2f'; ctx.fillRect(-11.6 * u, -3.5 * u, 23.2 * u, 3.6 * u) // obi
  ctx.fillStyle = '#ffd54f'; ctx.fillRect(-11.6 * u, -2 * u, 23.2 * u, 0.5 * u)
  ctx.fillStyle = '#ffffffcc'; ctx.fillRect(-12 * u, 3.6 * u, 24 * u, 1.4 * u) // white hem trim
  // neck + head
  ctx.fillStyle = SKIN; ctx.fillRect(-2.2 * u, -30 * u, 4.4 * u, 4 * u)
  const hy0 = -37 * u
  ctx.fillStyle = '#1a1210'; ctx.beginPath(); ctx.arc(0, hy0 - 1.2 * u, 9 * u, 0, 7); ctx.fill() // hair
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.ellipse(0, hy0 + 1.4 * u, 7.6 * u, 7 * u, 0, 0, 7); ctx.fill()
  ctx.fillStyle = '#1a1210'; ctx.beginPath(); ctx.moveTo(-7.4 * u, hy0 - 1 * u) // fringe
  for (let i = 0; i <= 6; i++) ctx.lineTo((-7.4 + i * 14.8 / 6) * u, hy0 + (i % 2 ? -1 : -3.4) * u)
  ctx.lineTo(7.4 * u, hy0 - 6 * u); ctx.lineTo(-7.4 * u, hy0 - 6 * u); ctx.fill()
  // nejiri hachimaki: twisted red-and-white headband, knot on the side with fluttering tails
  const by = hy0 - 4.6 * u
  ctx.save(); ctx.beginPath(); ctx.rect(-9.2 * u, by - 1.3 * u, 18.4 * u, 2.6 * u); ctx.clip()
  ctx.fillStyle = '#fff'; ctx.fillRect(-9.2 * u, by - 1.3 * u, 18.4 * u, 2.6 * u)
  ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 1 * u
  for (let x = -10; x < 10; x += 2.4) { ctx.beginPath(); ctx.moveTo(x * u, by + 1.4 * u); ctx.lineTo((x + 2) * u, by - 1.4 * u); ctx.stroke() }
  ctx.restore()
  const flutter = Math.sin(now / 140) * 1.2 * u
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 0.4 * u
  for (const [ex, ey] of [[15 * u, by - 3 * u + flutter], [14 * u, by + 3 * u - flutter]]) {
    ctx.beginPath(); ctx.moveTo(8 * u, by - 0.8 * u); ctx.quadraticCurveTo(11 * u, by + flutter * 0.5, ex, ey); ctx.lineTo(ex - 0.6 * u, ey + 1.4 * u)
    ctx.quadraticCurveTo(10.5 * u, by + 1.5 * u + flutter * 0.5, 8 * u, by + 0.8 * u); ctx.fill(); ctx.stroke()
  }
  ctx.beginPath(); ctx.arc(8.4 * u, by, 1.6 * u, 0, 7); ctx.fill(); ctx.stroke()
  // face: blinks now and then, opens its mouth for a big "Yo!" on every good hit
  const happy = now < happyUntil
  if (now > blinkAt + 3600) blinkAt = now
  const blink = now - blinkAt < 130
  ctx.fillStyle = '#1a1210'
  for (const d of [-1, 1]) {
    if (blink || happy) { ctx.strokeStyle = '#1a1210'; ctx.lineWidth = 0.6 * u; ctx.beginPath(); ctx.arc(d * 3 * u, hy0 + 1.4 * u, 1.2 * u, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke() }
    else { ctx.beginPath(); ctx.ellipse(d * 3 * u, hy0 + 1 * u, 1 * u, 1.35 * u, 0, 0, 7); ctx.fill()
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d * 3 * u + 0.35 * u, hy0 + 0.5 * u, 0.38 * u, 0, 7); ctx.fill(); ctx.fillStyle = '#1a1210' }
  }
  ctx.fillStyle = '#ff8a8a77'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(d * 5 * u, hy0 + 3.6 * u, 1.3 * u, 0, 7); ctx.fill() }
  if (happy || combo >= 5) { ctx.fillStyle = '#8b1a1a'; ctx.beginPath(); ctx.ellipse(0, hy0 + 4.4 * u, 1.9 * u, happy ? 1.8 * u : 1 * u, 0, 0, Math.PI); ctx.fill() }
  else { ctx.strokeStyle = '#8b1a1a'; ctx.lineWidth = 0.55 * u; ctx.beginPath(); ctx.arc(0, hy0 + 3.4 * u, 1.8 * u, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke() }
  ctx.restore()
}
function drawStage(now, elapsed) {
  tilt += ((poseLive(now) ? poseTilt : Math.sin(elapsed / (60000 / song.bpm) * Math.PI) * 0.025) - tilt) * 0.2
  const b = body(now, elapsed), arms = [0, 1].map((l) => arm(l, now, b.sh))
  drawColumn(0); drawColumn(1)
  drawDrummer(now, b)
  drawDrum()
  drawRing(0); drawRing(1)
  arms.forEach((r, l) => drawArm(b.sh[l], r, l))
  if (!poseLive(now) && now > 4000) {
    ctx.font = `600 ${2.2 * u}px system-ui`; ctx.textAlign = 'center'; ctx.fillStyle = '#fffd'
    ctx.fillText('No phone? Press F / J or click the left / right half', cx, floorY + 3.4 * u)
  }
}
function drawCountdown(elapsed) {
  const stageIdx = Math.min(STAGES.length - 1, Math.floor((elapsed + COUNTDOWN_MS) / 700))
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 14
  ctx.font = '900 140px system-ui'; ctx.fillText(STAGES[stageIdx], W / 2, H * 0.45)
  ctx.shadowBlur = 0; ctx.font = '700 40px system-ui'; ctx.fillText(song.name, W / 2, H * 0.28)
}
function drawCelebrate() {
  ctx.fillStyle = 'rgba(10,5,25,0.55)'; ctx.fillRect(0, 0, W, H)
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'
  ctx.font = '900 76px system-ui'; ctx.fillText('🥁 Great drumming! 🥁', W / 2, H * 0.38)
  ctx.font = '700 42px system-ui'; ctx.fillText(`Score: ${score}   Best combo: ${bestCombo}`, W / 2, H * 0.38 + 70)
  ctx.font = '500 26px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)'
  ctx.fillText(mode === 'spotify' ? 'Pick another song…' : 'Next song coming up…', W / 2, H * 0.38 + 120)
}

let lastFrame = performance.now()
function draw() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now
  const elapsed = now - t0
  if (phase === 'countdown' && elapsed >= 0) phase = 'playing'
  ctx.clearRect(0, 0, W, H)
  drawBackground(now)
  if (phase !== 'celebrate' && phase !== 'idle') {
    for (const n of song.notes) {
      if (!n.played && elapsed >= n.t) { if (mode === 'builtin') drumHit(n.lane); n.played = true; pulse(n.lane, 0.5) }
      if (!n.hit && !n.missed && elapsed > n.t + HIT_WINDOW_MS) n.missed = true
    }
    drumPulse[0] = Math.max(0, drumPulse[0] - dt * 2.2); drumPulse[1] = Math.max(0, drumPulse[1] - dt * 2.2)
    drawStage(now, elapsed)
    drawNotes(elapsed)
    if (phase === 'countdown') drawCountdown(elapsed)
    drawFx(dt)
    ctx.font = '700 30px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(song.name, 24, 50)
    ctx.font = '700 32px system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(`Score ${score}`, W - 24, 50)
    if (combo > 1) { ctx.font = '600 26px system-ui'; ctx.fillStyle = '#ffd23f'; ctx.fillText(`combo x${combo}`, W - 24, 84) }
  } else { drawFx(dt); drawCelebrate() }
  drawConfetti()
  if (phase === 'playing' && elapsed > song.totalMs + TAIL_MS) { phase = 'celebrate'; celebrateAt = now; songChime(); burstConfetti(200) }
  else if (phase === 'celebrate' && now - celebrateAt > CELEBRATE_MS) {
    if (mode === 'spotify') { phase = 'idle'; spotifyPanelShow('search') } // no page reload in Spotify mode - keeps the login/token in memory
    else { const next = (songIdx + 1) % SONGS.length, carry = next === 0 ? 0 : score; location.href = `taiko.html?song=${next + 1}&score=${carry}` }
  }
  requestAnimationFrame(draw)
}
startBuiltinSong((parseInt(params.get('song')) || 1) - 1)
spotifyHandleRedirect()
draw()
</script>
