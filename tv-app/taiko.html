<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiko Drums — Kids Motion Game</title>
<style>
  html,body{margin:0;height:100%;background:#1a0b2a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;top:8px;left:12px;margin:0;color:#e8dcff;font:14px system-ui;opacity:.85;max-width:70vw}
  #ver{position:fixed;right:12px;bottom:8px;color:#9b8bb0;font:14px monospace}
</style>
<pre id="hint">Drum along to the beat! Swing a hand down like a drumstick when a note reaches the ring - left hand for the blue lane, right hand for the orange lane. No phone: F/J keys or click the top/bottom half. Esc for menu.</pre>
<div id="ver"></div>
<canvas id="c"></canvas>
<script>
// ---- A Taiko-no-Tatsujin-style rhythm game: notes scroll right-to-left down two lanes and you "drum" them by
// swinging a hand down when they reach the ring, same phone-tracks-your-body pipeline as the rest of tv-app
// (kp messages relayed from phone-app, see onPose below - reuses the same BODY keypoint order flight-test.html
// reads, no phone-app or server changes needed). No fail state, same philosophy as Trace/Jump/Flight: the
// backing beat always plays in full regardless of how well you hit it, so it always sounds like a real song;
// good timing just adds score, sparkle and a happier drum face. 4 songs of increasing tempo/density, auto-
// advancing on finish and carrying score forward, looping back to song 1 with a fresh score after the last -
// same convention as flight-test.html's LEVELS. ?song=2 jumps straight to a song.
fetch('/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => document.getElementById('ver').textContent = 'v' + v.version).catch(() => {})

// ---- Songs: bars are 8-character strings, one char per eighth note (2 chars per beat, 4/4 time).
// '.' = rest, 'L' = left-hand note, 'R' = right-hand note, 'B' = both hands at once. ----
function altBars(a, b, n) { const out = []; for (let i = 0; i < n; i++) out.push(a, b); return out }
function buildSong(name, bpm, bars, theme) {
  const stepMs = 60000 / bpm / 2, notes = []
  let step = 0
  for (const bar of bars) {
    for (const ch of bar) {
      if (ch === 'L' || ch === 'R') notes.push({ t: step * stepMs, lane: ch === 'L' ? 0 : 1, hit: false, missed: false, played: false })
      else if (ch === 'B') { notes.push({ t: step * stepMs, lane: 0, hit: false, missed: false, played: false }); notes.push({ t: step * stepMs, lane: 1, hit: false, missed: false, played: false }) }
      step++
    }
  }
  return { name, bpm, notes, totalMs: step * stepMs, theme }
}
const SONGS = [
  buildSong('Sunshine Beat', 78, Array(8).fill('L...R...'), { bg: ['#fff2b0', '#7fc8f8'] }),
  buildSong('Bouncy Bus', 96, altBars('L.R.L.R.', 'L.RBL.R.', 6), { bg: ['#c8f7c5', '#4fb3ff'] }),
  buildSong('Jungle Groove', 112, altBars('L.R.L.RB', 'L.RL.R.B', 8), { bg: ['#ffd9a0', '#3aa66b'] }),
  buildSong('Rocket Rhythm', 130, altBars('LRLRLRLR', 'LRBLRB..', 10), { bg: ['#f0a0e8', '#241a4a'] }),
]
const params = new URLSearchParams(location.search)
let score = parseInt(params.get('score')) || 0
const songIdx = Math.max(0, Math.min(SONGS.length - 1, (parseInt(params.get('song')) || 1) - 1))
const song = SONGS[songIdx]

const cv = document.getElementById('c'), ctx = cv.getContext('2d')
let W, H
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight }
addEventListener('resize', resize); resize()
const laneY = (l) => l === 0 ? H * 0.36 : H * 0.62
const targetX = () => W * 0.14
const spawnX = () => W * 1.05

// ---- Timing: a short lead-in count-in before the beat starts, matching the DRUM_STAGES text below. ----
const COUNTDOWN_MS = 2800, NOTE_TRAVEL_MS = 1700, HIT_WINDOW_MS = 260, TAIL_MS = 1200, CELEBRATE_MS = 3000
const STAGES = ['3', '2', '1', 'Drum!']
const t0 = performance.now() + COUNTDOWN_MS // the moment beat 0 happens; notes/countdown are all relative to this
let phase = 'countdown', celebrateAt = null, combo = 0, bestCombo = 0
const drumPulse = [0, 0]
const pulse = (l, amt) => { drumPulse[l] = Math.max(drumPulse[l], amt) }

// ---- Audio: everything synthesised, no files (see tv-app/index.html's sfx for the same convention). The
// backing beat (drumHit) always plays on schedule; a correct swing layers a bright chime on top. ----
let actx, muted = false
const audioOn = () => actx && actx.state === 'running' && !muted
function tone(f, t0 = 0, dur = 0.3, vol = 0.2, type = 'triangle') {
  if (!audioOn()) return
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0
  o.type = type; o.frequency.value = f
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur)
}
function drumHit(lane) {
  if (!audioOn()) return
  const t = actx.currentTime, f = lane === 0 ? 150 : 440
  const o = actx.createOscillator(), g = actx.createGain()
  o.type = lane === 0 ? 'sine' : 'triangle'
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.14)
  g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16)
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.16)
}
const CHIME_NOTES = [659.25, 783.99, 880, 1046.5, 1318.5]
const hitChime = (c) => tone(CHIME_NOTES[Math.min(c, CHIME_NOTES.length - 1)], 0, 0.28, 0.18, 'sine')
const songChime = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.4, 0.22))
const unlock = () => { actx ||= new AudioContext(); actx.resume() }

// ---- Feedback: sparkles + floating text + confetti, same simple particle system as tv-app/index.html. ----
const fx = [], confetti = []
function spark(x, y, n, c) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7 - 1, life: 0, max: 500 + Math.random() * 400, c }) }
function popText(text, x, y, c) { fx.push({ text, x, y, vx: 0, vy: -1.4, life: 0, max: 1100, c }) }
function drawFx(dt) {
  for (const f of fx) {
    f.life += dt * 1000; f.x += f.vx; f.y += f.vy
    if (f.text) { ctx.globalAlpha = Math.max(0, 1 - f.life / f.max); ctx.font = '800 40px system-ui'; ctx.textAlign = 'center'
      ctx.fillStyle = f.c; ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.fillText(f.text, f.x, f.y); ctx.shadowBlur = 0 }
    else { f.vy += 0.22; ctx.globalAlpha = Math.max(0, 1 - f.life / f.max); ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, 7); ctx.fill() }
  }
  ctx.globalAlpha = 1
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life > fx[i].max) fx.splice(i, 1)
}
function burstConfetti(n) { for (let i = 0; i < n; i++) confetti.push({ x: W / 2, y: H / 2, vx: (Math.random() - .5) * 24, vy: -Math.random() * 20 - 4,
  r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: `hsl(${Math.random() * 360} 90% 60%)`, s: 8 + Math.random() * 10 }) }
function drawConfetti() {
  for (const c of confetti) { c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.r += c.vr
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore() }
  while (confetti.length && confetti[0].y > H + 50) confetti.shift()
}

// ---- Hitting a note: the nearest not-yet-resolved note in that lane, within HIT_WINDOW_MS either side of now.
// Missing entirely is silent and score-neutral (no fail state) - the backing beat played it anyway. ----
function strike(lane) {
  if (phase !== 'playing') return
  const elapsed = performance.now() - t0
  let best = null, bestDist = Infinity
  for (const n of song.notes) {
    if (n.lane !== lane || n.hit || n.missed) continue
    const d = Math.abs(elapsed - n.t)
    if (d <= HIT_WINDOW_MS && d < bestDist) { best = n; bestDist = d }
  }
  pulse(lane, 1)
  if (!best) return
  best.hit = true; combo++; bestCombo = Math.max(bestCombo, combo); score += 10 + Math.min(combo, 10)
  hitChime(Math.min(combo, 4))
  spark(targetX(), laneY(lane), 12, lane === 0 ? '#4fc3ff' : '#ffb24f')
  popText(combo > 1 ? `${combo} combo!` : 'Nice!', targetX(), laneY(lane) - 50, '#fff')
  if (combo && combo % 10 === 0) burstConfetti(60)
}

// ---- Input: phone pose (a quick downward swing of either wrist), keyboard F/J, or a click on the top/bottom
// half - same "phone optional" fallback as flight-test.html's keyboard controls. ----
const POSE_TIMEOUT_MS = 500, STRIKE_VELOCITY = 1.8, STRIKE_COOLDOWN_MS = 220
const wristHist = [[], []], wristY = [0.5, 0.5], lastStrikeAt = [-1e9, -1e9]
let lastPoseAt = -1e9
// b = phone's full body keypoint array, phone-app's BODY order: [nose, Lsh, Rsh, Lel, Rel, Lwr, Rwr, Lhip, Rhip, ...]
function onPose(b) {
  const now = performance.now(); lastPoseAt = now
  ;[5, 6].forEach((idx, lane) => {
    const y = b[idx][1]
    wristY[lane] = wristY[lane] * 0.7 + y * 0.3
    const h = wristHist[lane]; h.push({ t: now, y }); while (h.length && now - h[0].t > 150) h.shift()
    if (h.length < 2) return
    const vel = (y - h[0].y) / ((now - h[0].t) / 1000) // normalized y-units/sec, positive = swinging down
    if (vel > STRIKE_VELOCITY && now - lastStrikeAt[lane] > STRIKE_COOLDOWN_MS) { lastStrikeAt[lane] = now; strike(lane) }
  })
}
const ws = new WebSocket(`wss://${location.host}/?role=tv`)
ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.type === 'kp') { const b = (m.ps?.[0] || m).b; if (b) onPose(b) } }
addEventListener('pointerdown', (e) => { unlock(); if (e.clientY < H / 2) strike(0); else strike(1) })
addEventListener('keydown', (e) => {
  unlock()
  if (e.key === 'Escape') location.href = 'index.html'
  else if (e.key === 'f' || e.key === 'F' || e.key === 'ArrowLeft') strike(0)
  else if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowRight') strike(1)
  else if (e.key === 'm' || e.key === 'M') muted = !muted
})

// ---- Render ----
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  g.addColorStop(0, song.theme.bg[0]); g.addColorStop(1, song.theme.bg[1])
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
}
function drawLane(l) {
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = H * 0.1
  ctx.beginPath(); ctx.moveTo(targetX(), laneY(l)); ctx.lineTo(W, laneY(l)); ctx.stroke()
}
function drawNotes(elapsed) {
  for (const n of song.notes) {
    if (n.hit) continue
    const dt = n.t - elapsed
    if (dt > NOTE_TRAVEL_MS || dt < -HIT_WINDOW_MS - 50) continue
    const x = targetX() + (dt / NOTE_TRAVEL_MS) * (spawnX() - targetX()), y = laneY(n.lane), r = H * 0.035
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7)
    ctx.fillStyle = n.missed ? 'rgba(255,255,255,.3)' : (n.lane === 0 ? '#2fb2ff' : '#ff9a3d')
    ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke()
  }
}
function drawDrum(l) {
  const x = targetX(), y = laneY(l), color = l === 0 ? '#2fb2ff' : '#ff9a3d', dark = l === 0 ? '#0e5a86' : '#a85210'
  const r = H * 0.078 * (1 + drumPulse[l] * 0.3)
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.85, 0, 0, 7); ctx.fillStyle = color; ctx.fill(); ctx.strokeStyle = dark; ctx.lineWidth = 6; ctx.stroke()
  ctx.fillStyle = '#fff'
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(x + d * r * 0.3, y - r * 0.15, r * 0.14, 0, 7); ctx.fill() }
  ctx.fillStyle = '#123'
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(x + d * r * 0.3, y - r * 0.15, r * 0.07, 0, 7); ctx.fill() }
  ctx.strokeStyle = '#123'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y + r * 0.25, r * 0.22, 0, Math.PI); ctx.stroke()
}
function drawHandDots(now) {
  if (now - lastPoseAt > POSE_TIMEOUT_MS * 3) return
  for (let l = 0; l < 2; l++) {
    const x = W * 0.5 + (l === 0 ? -40 : 40), y = H * 0.15 + wristY[l] * H * 0.65
    ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(x, y, 14, 0, 7); ctx.fillStyle = l === 0 ? '#2fb2ff' : '#ff9a3d'; ctx.fill(); ctx.globalAlpha = 1
  }
}
function drawCountdown(elapsed) {
  const stageIdx = Math.min(STAGES.length - 1, Math.floor((elapsed + COUNTDOWN_MS) / 700))
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.shadowColor = '#000'; ctx.shadowBlur = 14
  ctx.font = '900 140px system-ui'; ctx.fillText(STAGES[stageIdx], W / 2, H * 0.45)
  ctx.shadowBlur = 0; ctx.font = '700 40px system-ui'; ctx.fillText(song.name, W / 2, H * 0.28)
}
function drawCelebrate() {
  ctx.fillStyle = 'rgba(10,5,25,0.55)'; ctx.fillRect(0, 0, W, H)
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'
  ctx.font = '900 76px system-ui'; ctx.fillText('🥁 Great drumming! 🥁', W / 2, H * 0.38)
  ctx.font = '700 42px system-ui'; ctx.fillText(`Score: ${score}   Best combo: ${bestCombo}`, W / 2, H * 0.38 + 70)
  ctx.font = '500 26px system-ui'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText('Next song coming up…', W / 2, H * 0.38 + 120)
}

let lastFrame = performance.now()
function draw() {
  const now = performance.now(), dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now
  const elapsed = now - t0
  if (phase === 'countdown' && elapsed >= 0) phase = 'playing'
  ctx.clearRect(0, 0, W, H)
  drawBackground()
  if (phase !== 'celebrate') {
    for (const n of song.notes) {
      if (!n.played && elapsed >= n.t) { drumHit(n.lane); n.played = true; pulse(n.lane, 0.5) }
      if (!n.hit && !n.missed && elapsed > n.t + HIT_WINDOW_MS) n.missed = true
    }
    drumPulse[0] = Math.max(0, drumPulse[0] - dt * 2.2); drumPulse[1] = Math.max(0, drumPulse[1] - dt * 2.2)
    drawLane(0); drawLane(1)
    drawNotes(elapsed)
    drawDrum(0); drawDrum(1)
    drawHandDots(now)
    if (phase === 'countdown') drawCountdown(elapsed)
    drawFx(dt)
    ctx.font = '700 30px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillText(song.name, 24, 50)
    ctx.font = '700 32px system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(`Score ${score}`, W - 24, 50)
    if (combo > 1) { ctx.font = '600 26px system-ui'; ctx.fillStyle = '#ffd23f'; ctx.fillText(`combo x${combo}`, W - 24, 84) }
  } else { drawFx(dt); drawCelebrate() }
  drawConfetti()
  if (phase === 'playing' && elapsed > song.totalMs + TAIL_MS) { phase = 'celebrate'; celebrateAt = now; songChime(); burstConfetti(200) }
  else if (phase === 'celebrate' && now - celebrateAt > CELEBRATE_MS) {
    const next = (songIdx + 1) % SONGS.length, carry = next === 0 ? 0 : score
    location.href = `taiko.html?song=${next + 1}&score=${carry}`
  }
  requestAnimationFrame(draw)
}
draw()
</script>
