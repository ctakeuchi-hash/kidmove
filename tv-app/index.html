<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV — Kids Motion Game</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  pre{position:fixed;top:12px;left:16px;margin:0;color:#0f0;font:28px monospace}
</style>
<canvas id="c"></canvas>
<pre id="hud">connecting…</pre>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud')
const resize = () => { cv.width = innerWidth; cv.height = innerHeight }
addEventListener('resize', resize); resize()

const COLORS = ['#4af', '#f84', '#4f8', '#fd4'] // L wrist, R wrist, L hip, R hip
let kp = null, tvOff = null, phoneOff = null, lat = [], msgs = 0, fps = 0, last = performance.now()

const ws = new WebSocket(`wss://${location.host}/?role=tv`)
ws.onopen = () => { hud.textContent = 'connected, waiting for phone…'; sync(); setInterval(sync, 2000) }
ws.onclose = () => hud.textContent = 'disconnected'

// Clock sync: offset = serverTime - localTime, so phone and TV timestamps are comparable.
const sync = () => ws.send(JSON.stringify({ type: 'sync', t0: Date.now() }))
ws.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'sync') tvOff = m.s - (m.t0 + Date.now()) / 2
  else if (m.type === 'off') phoneOff = m.off
  else if (m.type === 'kp') {
    kp = m.k; msgs++
    if (tvOff !== null && phoneOff !== null) {
      lat.push((Date.now() + tvOff) - (m.t + phoneOff))
      if (lat.length > 60) lat.shift()
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height)
  if (kp) kp.forEach(([x, y], i) => {
    ctx.fillStyle = COLORS[i]
    ctx.beginPath()
    ctx.arc((1 - x) * cv.width, y * cv.height, i < 2 ? 28 : 14, 0, 7) // x mirrored to match a mirror view
    ctx.fill()
  })
  requestAnimationFrame(draw)
}
draw()

setInterval(() => {
  const now = performance.now()
  fps = msgs / ((now - last) / 1000); msgs = 0; last = now
  const avg = lat.length ? lat.reduce((a, b) => a + b) / lat.length : null
  const max = lat.length ? Math.max(...lat) : null
  hud.textContent = avg === null ? `msgs/s ${fps.toFixed(0)}\nlatency: waiting for clock sync…`
    : `latency avg ${avg.toFixed(0)}ms  max ${max.toFixed(0)}ms\nmsgs/s ${fps.toFixed(0)}`
}, 500)
</script>
