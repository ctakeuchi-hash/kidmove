<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV — Kids Motion Game</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b1a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #menu{position:fixed;top:10px;right:12px;display:flex;gap:8px}
  #menu button{font:600 18px system-ui;padding:8px 16px;border-radius:20px;border:2px solid #fff6;background:#0006;color:#fff;cursor:pointer}
  #menu button.on{background:#fff;color:#111}
  pre{position:fixed;top:8px;left:12px;margin:0;color:#6f6;font:16px monospace;opacity:.7}
</style>
<canvas id="c"></canvas>
<div id="menu"><button data-g="letters">✏️ Letters (1)</button><button data-g="jump">🦘 Jump (2)</button></div>
<pre id="hud">connecting…</pre>
<script>
// ---- Config: override any of these via URL, e.g. /tv/?threshold=0.6&brush=0.12&mouse=1 ----
// Live tuning: ArrowUp/Down = threshold ±5% (Jump: jump size ±0.01), ArrowRight/Left = next/prev letter.
// Modes: keys 1 / 2, the buttons top-right, the phone's buttons, or voice ("play jump dodge"). Space = fake jump (testing).
const CONFIG = {
  threshold: 0.7,   // fraction of the letter that must be covered to pass
  brush: 0.09,      // brush radius as a fraction of letter height (bigger = more forgiving)
  letters: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  pauseMs: 2500,    // celebration time before next letter
  jumpThreshold: 0.05, // Jump Dodge: hip rise (fraction of camera height) that counts as a jump
  jumpSpeed: 0.3,      // Jump Dodge: obstacle speed, screen widths per second
  game: 'letters',     // start mode: letters | jump
  mouse: 0,         // 1 = use the mouse as the wrist (test without a phone)
}
for (const [k, v] of new URLSearchParams(location.search)) if (k in CONFIG) CONFIG[k] = k === 'letters' || k === 'game' ? v : +v

const cv = document.getElementById('c'), ctx = cv.getContext('2d'), hud = document.getElementById('hud')
let W, H, size
const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; size = Math.min(W, H) * 0.8; loadLetter(idx) }
const FONT = () => `900 ${size}px "Arial Black", Arial, sans-serif`

// ---- Letter: sample the glyph body on a grid; coverage = fraction of samples the brush has touched ----
let winTimer, idx = 0, samples = [], step = 10, covered = 0, won = false, hue = 0
function loadLetter(i) {
  idx = (i + CONFIG.letters.length) % CONFIG.letters.length
  clearTimeout(winTimer) // a manual skip/restart must cancel the pending auto-advance
  won = false; covered = 0; trail.length = 0; confetti.length = 0
  hue = (idx * 47) % 360
  const off = new OffscreenCanvas(W, H), o = off.getContext('2d', { willReadFrequently: true })
  o.font = FONT(); o.textAlign = 'center'; o.fillStyle = '#000'
  const ch = CONFIG.letters[idx], m = o.measureText(ch)
  glyphY = H / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
  o.fillText(ch, W / 2, glyphY)
  const px = o.getImageData(0, 0, W, H).data
  step = Math.max(6, Math.round(size / 45)); samples = []
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step)
    if (px[(y * W + x) * 4 + 3] > 128) samples.push({ x, y, on: false })
}
let glyphY = 0

// ---- Input: dominant wrist = the one that has moved most in the last second ----
const hist = [[], []]      // per wrist: recent {t,x,y}
let dom = 0, prev = null   // prev = last trail point (same-hand continuity)
const trail = []           // {x,y,t,brk}
function motion(h) { let s = 0; for (let i = 1; i < h.length; i++) s += Math.hypot(h[i].x - h[i - 1].x, h[i].y - h[i - 1].y); return s }

function onWrists(w) { // w = [[x,y]|null, [x,y]|null] in canvas px
  const now = performance.now()
  w.forEach((p, i) => {
    if (!p) return
    const h = hist[i], l = h[h.length - 1]
    // light smoothing to kill camera jitter without adding noticeable lag
    const q = l ? { x: l.x * 0.4 + p[0] * 0.6, y: l.y * 0.4 + p[1] * 0.6 } : { x: p[0], y: p[1] }
    h.push({ t: now, ...q })
    while (h[0].t < now - 1000) h.shift()
  })
  const [a, b] = [motion(hist[0]), motion(hist[1])]
  const next = dom === 0 ? (b > a * 1.3 ? 1 : 0) : (a > b * 1.3 ? 0 : 1) // hysteresis: don't flicker between hands
  const switched = next !== dom; dom = next
  const h = hist[dom], p = h[h.length - 1]
  if (!p || won) return
  trail.push({ x: p.x, y: p.y, t: now, brk: switched || !trail.length })
  paint(p, switched ? null : prev); prev = p
}

function paint(p, from) {
  const R = CONFIG.brush * size, R2 = R * R
  const n = from ? Math.max(1, Math.ceil(Math.hypot(p.x - from.x, p.y - from.y) / (R / 2))) : 1 // interpolate so fast swings leave no gaps
  for (let k = 1; k <= n; k++) {
    const x = from ? from.x + (p.x - from.x) * k / n : p.x, y = from ? from.y + (p.y - from.y) * k / n : p.y
    for (const s of samples) if (!s.on && (s.x - x) ** 2 + (s.y - y) ** 2 < R2) { s.on = true; covered++ }
  }
  if (!won && samples.length && covered / samples.length >= CONFIG.threshold) win()
}

// ---- Celebration ----
const confetti = []
let actx
function tone(f, t0, dur) {
  const o = actx.createOscillator(), g = actx.createGain()
  o.type = 'triangle'; o.frequency.value = f
  g.gain.setValueAtTime(0.25, actx.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + t0 + dur)
  o.connect(g).connect(actx.destination); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur)
}
function celebrate(n) { // confetti + chime, shared by both games
  for (let i = 0; i < n; i++) confetti.push({ x: W / 2, y: H / 2, vx: (Math.random() - .5) * 26, vy: -Math.random() * 22 - 4,
    r: Math.random() * 6.28, vr: (Math.random() - .5) * .4, c: `hsl(${Math.random() * 360} 90% 60%)`, s: 8 + Math.random() * 10 })
  try { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.4)) } catch {}
}
function win() {
  won = true
  for (const s of samples) s.on = true // letter fills with colour
  celebrate(180)
  winTimer = setTimeout(() => loadLetter(idx + 1), CONFIG.pauseMs)
}
// Browsers block audio until a user gesture; one click/key on the TV page unlocks it.
const unlock = () => { actx ||= new AudioContext(); actx.resume() }
addEventListener('pointerdown', unlock); addEventListener('keydown', unlock)

// ---- Voice commands (structured, from the server) ----
const LEVELS = { easy: [0.5, 0.12], medium: [0.7, 0.09], hard: [0.85, 0.07] } // [threshold, brush]
const JUMP_LEVELS = { easy: [0.04, 0.22], medium: [0.05, 0.3], hard: [0.06, 0.42] } // [jumpThreshold, jumpSpeed]
function runCommand(name, input = {}) {
  if (name === 'switch_game') setMode(input.name)
  else if (name === 'restart_game') mode === 'jump' ? jumpReset() : loadLetter(0)
  else if (name === 'next_letter') mode === 'letters' && loadLetter(idx + 1)
  else if (name === 'set_difficulty' && LEVELS[input.level]) {
    [CONFIG.threshold, CONFIG.brush] = LEVELS[input.level]; [CONFIG.jumpThreshold, CONFIG.jumpSpeed] = JUMP_LEVELS[input.level]
  }
  else console.warn('unknown command', name, input)
}

// ---- Themes: server generates an image (or serves it from cache); we show a loading banner meanwhile ----
let bgImg = null, bgAlpha = 0, loading = null, notice = null // loading = theme being generated; notice = {text, until}
function themeLoading(theme) { loading = theme }
function themeAsset(m) {
  const img = new Image()
  img.onload = () => { bgImg = img; bgAlpha = 0; loading = null; notice = { text: m.theme, until: performance.now() + 2500 } } // fades in via bgAlpha
  img.onerror = () => themeError(m.theme)
  img.src = m.url
}
function themeError(theme) { loading = null; notice = { text: `Couldn't paint "${theme}" - try again!`, until: performance.now() + 3500 } }

function drawBackground() {
  if (!bgImg) return
  bgAlpha = Math.min(1, bgAlpha + 0.03)
  const sc = Math.max(W / bgImg.width, H / bgImg.height) // cover-fit
  ctx.globalAlpha = bgAlpha
  ctx.drawImage(bgImg, (W - bgImg.width * sc) / 2, (H - bgImg.height * sc) / 2, bgImg.width * sc, bgImg.height * sc)
  ctx.fillStyle = 'rgba(11,11,26,0.45)'; ctx.fillRect(0, 0, W, H) // darken so the letter stays readable
  ctx.globalAlpha = 1
}

function drawBanner(now) {
  const text = loading ? `Painting ${loading}…` : notice && now < notice.until ? notice.text : null
  if (!text) return
  ctx.save()
  ctx.font = '600 40px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const w = ctx.measureText(text).width + (loading ? 110 : 60), x = W / 2, y = 70
  ctx.fillStyle = 'rgba(20,20,50,0.85)'; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 36, w, 72, 36); ctx.fill()
  ctx.fillStyle = '#fff'; ctx.fillText(text, x + (loading ? 28 : 0), y + 2)
  if (loading) { // spinner + pulsing sparkle so the wait looks deliberate
    const a = now / 250, cx = x - w / 2 + 44
    ctx.strokeStyle = `hsl(${(now / 8) % 360} 90% 65%)`; ctx.lineWidth = 6; ctx.lineCap = 'round'
    ctx.beginPath(); ctx.arc(cx, y, 16, a, a + 4.2); ctx.stroke()
  }
  ctx.restore()
}

// ---- Modes: both games read the same pose stream via onPose() ----
let mode = ['letters', 'jump'].includes(CONFIG.game) ? CONFIG.game : 'letters'
function setMode(name) {
  if (!['letters', 'jump'].includes(name) || name === mode) return
  clearTimeout(winTimer); confetti.length = 0; mode = name
  if (mode === 'letters') loadLetter(idx); else jumpReset()
  syncMenu(); notice = { text: mode === 'jump' ? 'Jump Dodge! Jump over the spikes' : 'Sky-Writing! Trace the letter', until: performance.now() + 2500 }
}
const syncMenu = () => document.querySelectorAll('#menu button').forEach((b) => b.classList.toggle('on', b.dataset.g === mode))
document.querySelectorAll('#menu button').forEach((b) => b.onclick = () => setMode(b.dataset.g))
function onPose(k, wristPx) { // k = [L wrist, R wrist, L hip, R hip], normalised
  if (mode === 'letters') onWrists(wristPx)
  else onHips(k)
}

// ---- Game 2: Jump Dodge (hip height vs. a slowly-adapting standing baseline) ----
const jump = { base: null, rise: 0, lastPose: 0, fakeAt: -1e9, obstacles: [], nextSpawn: 0, lives: 3, score: 0, hitUntil: 0, over: 0, t: 0 }
function jumpReset() { Object.assign(jump, { obstacles: [], lives: 3, score: 0, hitUntil: 0, over: 0, nextSpawn: performance.now() + 1500, t: 0 }) }
function onHips(k) {
  const y = (k[2][1] + k[3][1]) / 2 // 0 = top of camera frame, so a jump makes y smaller
  if (jump.base === null) jump.base = y
  jump.rise = jump.base - y
  // Baseline follows where you stand (camera distance/crouching), but not during a jump or it would chase you up.
  if (jump.rise < CONFIG.jumpThreshold * 0.5) jump.base += (y - jump.base) * 0.02
  jump.lastPose = performance.now()
}
function drawJump(now) {
  const dt = jump.t ? Math.min(0.05, (now - jump.t) / 1000) : 0; jump.t = now
  const ground = H * 0.8, obH = H * 0.11, obW = obH * 0.9, pw = obH * 0.7, px = W * 0.22, thr = CONFIG.jumpThreshold
  const fake = (now - jump.fakeAt) / 600 // Space bar = scripted jump for testing without a camera
  let rise = now - jump.lastPose > 400 ? 0 : Math.max(0, jump.rise) // lost tracking counts as standing still, not as a stuck jump
  if (fake >= 0 && fake <= 1) rise = Math.max(rise, Math.sin(Math.PI * fake) * thr * 2)
  const lift = Math.min(2.5, rise / thr) * obH // feet clear a spike exactly when rise >= threshold

  if (!jump.over) {
    if (now > jump.nextSpawn) {
      jump.obstacles.push({ x: W + obW, hit: false, passed: false })
      jump.nextSpawn = now + (0.45 + Math.random() * 0.35) / CONFIG.jumpSpeed * 1000 // gap of 0.45-0.8 screen widths
    }
    for (const o of jump.obstacles) {
      o.x -= W * CONFIG.jumpSpeed * dt
      const overlap = o.x < px + pw / 2 && o.x + obW > px - pw / 2
      if (overlap && !o.hit && rise < thr && now > jump.hitUntil) {
        o.hit = true; jump.hitUntil = now + 1000
        if (--jump.lives <= 0) jump.over = now + 3000
      } else if (!o.hit && !o.passed && o.x + obW < px - pw / 2) {
        o.passed = true
        if (++jump.score % 5 === 0) celebrate(80)
      }
    }
    jump.obstacles = jump.obstacles.filter((o) => o.x > -obW * 2)
  } else if (now > jump.over) jumpReset()

  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, ground, W, H - ground)
  for (const o of jump.obstacles) {
    ctx.fillStyle = o.hit ? '#888' : '#ff7b3d'
    ctx.beginPath(); ctx.moveTo(o.x, ground); ctx.lineTo(o.x + obW / 2, ground - obH); ctx.lineTo(o.x + obW, ground); ctx.fill()
  }
  const blink = now < jump.hitUntil && Math.floor(now / 100) % 2
  if (!blink) { // player: rounded body, tracks your real jump height
    const top = ground - lift - pw * 1.4
    ctx.fillStyle = '#4af'; ctx.beginPath(); ctx.roundRect(px - pw / 2, top, pw, pw * 1.4, pw * 0.3); ctx.fill()
    ctx.fillStyle = '#fff'; for (const dx of [-0.2, 0.2]) { ctx.beginPath(); ctx.arc(px + pw * dx, top + pw * 0.4, pw * 0.13, 0, 7); ctx.fill() }
  }
  ctx.font = '600 34px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff'
  ctx.fillText(`Score ${jump.score}   ${'♥'.repeat(Math.max(0, jump.lives))}`, 20, 64)
  if (jump.over) { ctx.font = '900 96px system-ui'; ctx.textAlign = 'center'; ctx.fillText(`Game over! Score ${jump.score}`, W / 2, H * 0.42) }
}

// ---- Dev controls ----
addEventListener('keydown', (e) => {
  if (e.key === '1') setMode('letters')
  else if (e.key === '2') setMode('jump')
  else if (e.key === ' ') jump.fakeAt = performance.now()
  else if (mode === 'jump') {
    if (e.key === 'ArrowUp') CONFIG.jumpThreshold += 0.01
    else if (e.key === 'ArrowDown') CONFIG.jumpThreshold = Math.max(0.01, CONFIG.jumpThreshold - 0.01)
  }
  else if (e.key === 'ArrowRight') loadLetter(idx + 1)
  else if (e.key === 'ArrowLeft') loadLetter(idx - 1)
  else if (e.key === 'ArrowUp') CONFIG.threshold = Math.min(1, CONFIG.threshold + 0.05)
  else if (e.key === 'ArrowDown') CONFIG.threshold = Math.max(0.1, CONFIG.threshold - 0.05)
})
if (CONFIG.mouse) addEventListener('mousemove', (e) => onWrists([[e.clientX, e.clientY], null]))

// ---- Render ----
function drawLetters(now) {
  ctx.font = FONT(); ctx.textAlign = 'center'
  ctx.fillStyle = `rgba(255,255,255,${bgImg ? 0.25 : 0.10})`; ctx.fillText(CONFIG.letters[idx], W / 2, glyphY) // ghost letter
  ctx.fillStyle = `hsl(${hue} 90% 60%)`
  for (const s of samples) if (s.on) ctx.fillRect(s.x - step / 2, s.y - step / 2, step + 1, step + 1)

  ctx.lineCap = 'round'; ctx.lineWidth = 16; ctx.shadowBlur = 24; ctx.shadowColor = '#fff'
  while (trail.length && now - trail[0].t > 1500) trail.shift()
  for (let i = 1; i < trail.length; i++) {
    if (trail[i].brk) continue
    ctx.globalAlpha = 1 - (now - trail[i].t) / 1500
    ctx.strokeStyle = `hsl(${(hue + 180) % 360} 100% 75%)`
    ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke()
  }
  ctx.globalAlpha = 1
  const head = hist[dom][hist[dom].length - 1]
  if (head && !won) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(head.x, head.y, 20, 0, 7); ctx.fill() }
  ctx.shadowBlur = 0

  // progress bar with threshold marker (for tuning)
  const pct = samples.length ? covered / samples.length : 0, bw = W * 0.5, bx = (W - bw) / 2, by = H - 28
  ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(bx, by, bw, 12)
  ctx.fillStyle = `hsl(${hue} 90% 60%)`; ctx.fillRect(bx, by, bw * pct, 12)
  ctx.fillStyle = '#fff'; ctx.fillRect(bx + bw * CONFIG.threshold - 2, by - 4, 4, 20)
}

function draw() {
  const now = performance.now()
  ctx.clearRect(0, 0, W, H)
  drawBackground()
  mode === 'letters' ? drawLetters(now) : drawJump(now)
  for (const c of confetti) {
    c.x += c.vx; c.y += c.vy; c.vy += 0.5; c.r += c.vr
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore()
  }
  while (confetti.length && confetti[0].y > H + 50) confetti.shift()
  drawBanner(now)
  requestAnimationFrame(draw)
}

// ---- Network ----
let tvOff = null, phoneOff = null, lat = [], msgs = 0, last = performance.now()
const sync = () => ws.send(JSON.stringify({ type: 'sync', t0: Date.now() })) // clock offset = serverTime - localTime
const ws = new WebSocket(`wss://${location.host}/?role=tv`)
ws.onopen = () => { hud.textContent = 'connected, waiting for phone…'; sync(); setInterval(sync, 2000) }
ws.onclose = () => hud.textContent = 'disconnected'
ws.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'sync') tvOff = m.s - (m.t0 + Date.now()) / 2
  else if (m.type === 'off') phoneOff = m.off
  else if (m.type === 'game_command') runCommand(m.name, m.input)
  else if (m.type === 'theme_loading') themeLoading(m.theme)
  else if (m.type === 'theme_asset') themeAsset(m)
  else if (m.type === 'theme_error') themeError(m.theme)
  else if (m.type === 'kp') {
    msgs++
    // k = [L wrist, R wrist, L hip, R hip], normalised; x mirrored so it acts like a mirror
    onPose(m.k, [[(1 - m.k[0][0]) * W, m.k[0][1] * H], [(1 - m.k[1][0]) * W, m.k[1][1] * H]])
    if (tvOff !== null && phoneOff !== null) { lat.push((Date.now() + tvOff) - (m.t + phoneOff)); if (lat.length > 60) lat.shift() }
  }
}
setInterval(() => {
  const now = performance.now(), fps = msgs / ((now - last) / 1000); msgs = 0; last = now
  const avg = lat.length ? (lat.reduce((a, b) => a + b) / lat.length).toFixed(0) + 'ms' : '…'
  const info = mode === 'letters' ? `${CONFIG.letters[idx]}  ${(100 * covered / Math.max(1, samples.length)).toFixed(0)}% / ${(CONFIG.threshold * 100).toFixed(0)}%`
    : `jump size ${CONFIG.jumpThreshold.toFixed(2)}  rise ${Math.max(0, jump.rise).toFixed(3)}`
  hud.textContent = `${info}   latency ${avg}   ${fps.toFixed(0)}/s`
}, 500)

addEventListener('resize', resize); resize(); syncMenu(); if (mode === 'jump') jumpReset(); draw()
</script>
