<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone — Kids Motion Game</title>
<style>
  body{margin:0;font:14px system-ui;background:#000;color:#0f0}
  button{font:600 18px system-ui;padding:10px 16px}
  video{width:100vw;transform:scaleX(-1)} pre{margin:8px}
</style>
<video id="v" playsinline muted></video>
<div style="display:flex;gap:8px;padding:8px"><button data-g="letters">✏️ Letters</button><button data-g="jump">🦘 Jump</button></div>
<pre id="log">starting…</pre>
<pre id="voice">voice: starting…</pre>
<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs'

const log = (s) => document.getElementById('log').textContent = s
const video = document.getElementById('v')
const KEYS = [15, 16, 23, 24] // L wrist, R wrist, L hip, R hip

const ws = new WebSocket(`wss://${location.host}/?role=phone`)
await new Promise((r) => ws.onopen = r)

video.srcObject = await navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'user', width: 640, height: 480, frameRate: 30 }, audio: false })
await video.play()

const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm')
const pose = await PoseLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
    delegate: 'GPU' },
  runningMode: 'VIDEO', numPoses: 1 })

let frames = 0, last = performance.now(), inf = 0
function tick() {
  const t = Date.now() // stamped before inference so TV latency includes detection time
  const t0 = performance.now()
  const r = pose.detectForVideo(video, t0)
  inf = performance.now() - t0
  const lm = r.landmarks[0]
  if (lm && ws.readyState === 1) ws.send(JSON.stringify({ type: 'kp', t, k: KEYS.map((i) => [lm[i].x, lm[i].y, +lm[i].z.toFixed(3)]) }))
  frames++
  if (performance.now() - last > 1000) {
    log(`fps ${frames}\ninference ${inf.toFixed(1)}ms\n${lm ? 'tracking' : 'no pose'}`)
    frames = 0; last = performance.now()
  }
  video.requestVideoFrameCallback(tick)
}
video.requestVideoFrameCallback(tick)

// Clock sync: offset = serverTime - phoneTime; sent so TV can compare timestamps across devices.
async function sync() {
  const t0 = Date.now()
  ws.send(JSON.stringify({ type: 'sync', t0 }))
}
ws.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'voice_result') voiceLog.textContent = `heard: "${m.text}"\n→ ${m.command ? m.command.name + ' ' + JSON.stringify(m.command.input) : 'no command'}`
  if (m.type === 'sync') { const off = m.s - (m.t0 + Date.now()) / 2; ws.send(JSON.stringify({ type: 'off', off })) }
}
setInterval(sync, 2000); sync()

// Game menu: buttons send the same command voice does; the server relays phone messages to the TV unchanged.
document.querySelectorAll('button[data-g]').forEach((b) => b.onclick = () =>
  ws.send(JSON.stringify({ type: 'game_command', name: 'switch_game', input: { name: b.dataset.g } })))

// Voice: continuous browser speech recognition; each finished phrase goes to the server as a voice_command.
const voiceLog = document.getElementById('voice')
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
if (!SR) voiceLog.textContent = 'voice: not supported in this browser (try Chrome or Safari)'
else {
  const rec = new SR()
  rec.continuous = true; rec.interimResults = false; rec.lang = 'en-US'
  rec.onresult = (e) => {
    const text = e.results[e.results.length - 1][0].transcript.trim()
    if (text && ws.readyState === 1) ws.send(JSON.stringify({ type: 'voice_command', text }))
  }
  rec.onend = () => setTimeout(() => { try { rec.start() } catch {} }, 300) // the browser stops after silence; keep listening
  rec.onerror = (e) => { voiceLog.textContent = 'voice error: ' + e.error }
  rec.start(); voiceLog.textContent = 'voice: listening…'
}
</script>
