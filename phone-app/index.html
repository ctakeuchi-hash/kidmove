<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone — Kids Motion Game</title>
<style>
  body{margin:0;font:14px system-ui;background:#000;color:#0f0}
  button{font:600 16px system-ui;padding:9px 12px}
  video{width:100vw;transform:scaleX(-1)} pre{margin:8px}
</style>
<video id="v" playsinline muted></video>
<div id="remote" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px">
  <button data-c='{"name":"show_menu"}'>🏠 Menu</button>
  <button data-c='{"name":"switch_game","input":{"name":"upper"}}'>ABC</button>
  <button data-c='{"name":"switch_game","input":{"name":"lower"}}'>abc</button>
  <button data-c='{"name":"switch_game","input":{"name":"digits"}}'>123</button>
  <button data-c='{"name":"switch_game","input":{"name":"hiragana"}}'>あ</button>
  <button data-c='{"name":"switch_game","input":{"name":"katakana"}}'>ア</button>
  <button data-c='{"name":"switch_game","input":{"name":"jump"}}'>🦘 Jump</button>
  <button data-c='{"name":"set_players","input":{"players":1}}'>1P</button>
  <button data-c='{"name":"set_players","input":{"players":2}}'>2P</button>
  <button data-c='{"name":"next_letter"}'>⏭</button>
  <button data-c='{"name":"set_group","input":{"group":"vowels"}}'>Vowels</button>
  <button data-c='{"name":"set_group","input":{"group":"consonants"}}'>Consonants</button>
  <button data-c='{"name":"set_group","input":{"group":"all"}}'>All letters</button>
  <button data-c='{"name":"set_shuffle","input":{"on":true}}'>🔀 On</button>
  <button data-c='{"name":"set_shuffle","input":{"on":false}}'>🔀 Off</button>
</div>
<div id="ver" style="position:fixed;right:10px;bottom:8px;color:#0f0;opacity:.6;font:13px monospace"></div>
<pre id="log">starting…</pre>
<pre id="voice">voice: starting…</pre>
<script type="module">
import { PoseLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs'

fetch('/version', { cache: 'no-store' }).then((r) => r.json()).then((v) => document.getElementById('ver').textContent = 'v' + v.version).catch(() => {})
const log = (s) => document.getElementById('log').textContent = s
const video = document.getElementById('v')
const KEYS = [15, 16, 23, 24] // L wrist, R wrist, L hip, R hip
// Full upper/lower body for the TV avatar: nose, shoulders, elbows, wrists, hips, knees, ankles
const BODY = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]

const ws = new WebSocket(`wss://${location.host}/?role=phone`)
let wantPoses = 1 // how many people the TV wants tracked (1 or 2); set by the TV via the server
ws.addEventListener('message', (e) => { const m = JSON.parse(e.data); if (m.type === 'config') wantPoses = m.players === 2 ? 2 : 1 })
await new Promise((r) => ws.onopen = r)

video.srcObject = await navigator.mediaDevices.getUserMedia({
  video: { facingMode: 'user', width: 640, height: 480, frameRate: 30 }, audio: false })
await video.play()

const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm')
const pose = await PoseLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',
    delegate: 'GPU' },
  runningMode: 'VIDEO', numPoses: 1 })

let frames = 0, last = performance.now(), inf = 0, appliedPoses = 1
function tick() {
  if (appliedPoses !== wantPoses) { pose.setOptions({ numPoses: wantPoses }); appliedPoses = wantPoses } // 2 people costs more inference, so only when asked
  const t = Date.now() // stamped before inference so TV latency includes detection time
  const t0 = performance.now()
  const r = pose.detectForVideo(video, t0)
  inf = performance.now() - t0
  const lm = r.landmarks[0]
  if (lm && ws.readyState === 1) {
    const ps = r.landmarks.map((l) => ({ k: KEYS.map((i) => [l[i].x, l[i].y, +l[i].z.toFixed(3)]), b: BODY.map((i) => [+l[i].x.toFixed(3), +l[i].y.toFixed(3)]) }))
    ws.send(JSON.stringify({ type: 'kp', t, ar: +(video.videoWidth / video.videoHeight).toFixed(3), ps, k: ps[0].k, b: ps[0].b })) // k/b = first person, for older TV pages
  }
  frames++
  if (performance.now() - last > 1000) {
    log(`fps ${frames}\ninference ${inf.toFixed(1)}ms\n${lm ? 'tracking ' + r.landmarks.length + ' person(s)' : 'no pose'}`)
    frames = 0; last = performance.now()
  }
  video.requestVideoFrameCallback(tick)
}
video.requestVideoFrameCallback(tick)

// Clock sync: offset = serverTime - phoneTime; sent so TV can compare timestamps across devices.
async function sync() {
  const t0 = Date.now()
  ws.send(JSON.stringify({ type: 'sync', t0 }))
}
ws.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'voice_result') voiceLog.textContent = `heard: "${m.text}"\n→ ${m.command ? m.command.name + ' ' + JSON.stringify(m.command.input) : 'no command'}`
  if (m.type === 'sync') { const off = m.s - (m.t0 + Date.now()) / 2; ws.send(JSON.stringify({ type: 'off', off })) }
}
setInterval(sync, 2000); sync()

// Game menu: buttons send the same command voice does; the server relays phone messages to the TV unchanged.
document.querySelectorAll('button[data-c]').forEach((b) => b.onclick = () =>
  ws.send(JSON.stringify({ type: 'game_command', ...JSON.parse(b.dataset.c) })))

// Voice: continuous browser speech recognition; each finished phrase goes to the server as a voice_command.
const voiceLog = document.getElementById('voice')
const SR = window.SpeechRecognition || window.webkitSpeechRecognition
if (!SR) voiceLog.textContent = 'voice: not supported in this browser (try Chrome or Safari)'
else {
  const rec = new SR()
  rec.continuous = true; rec.interimResults = false; rec.lang = 'en-US'
  rec.onresult = (e) => {
    const text = e.results[e.results.length - 1][0].transcript.trim()
    if (text && ws.readyState === 1) ws.send(JSON.stringify({ type: 'voice_command', text }))
  }
  rec.onend = () => setTimeout(() => { try { rec.start() } catch {} }, 300) // the browser stops after silence; keep listening
  rec.onerror = (e) => { voiceLog.textContent = 'voice error: ' + e.error }
  rec.start(); voiceLog.textContent = 'voice: listening…'
}
</script>
